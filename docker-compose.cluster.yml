services:
  nixllm:
    image: ${CLI_PROXY_IMAGE:-ghcr.io/abilfida/nixllm:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        CORE_VERSION: ${CORE_VERSION:-unknown}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: nixllm-cluster
    environment:
      HOME_JWT: ${HOME_JWT:-}
    ports:
      - "8317:8317"
    volumes:
      - ${CLI_PROXY_HOME_PATH:-./home}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/nixllm/logs
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/nixllm/plugins
    command: >
      sh -eu -c '
        if [ -z "$$HOME_JWT" ]; then
          echo "HOME_JWT is required" >&2
          exit 1
        fi

        exec ./nixllm -home-jwt "$$HOME_JWT"
      '
    restart: unless-stopped
