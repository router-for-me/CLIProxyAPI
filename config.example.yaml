  # Provider options below apply to OAuth/file-backed credentials.
  # API-key credentials use their own group/key options.
  providers:
    aistudio:
      # When true, enable authentication for the WebSocket API (/v1/ws).
      ws-auth: true

    # Codex provider behavior.
    codex:
      # Experimental full-duplex Codex Responses WebSocket steering (default: false).
      # Keeps one upstream account/model per socket; accepted input is never replayed.
      response-steering: false
      # Disable forcing the official Codex User-Agent and Originator headers on HTTP/SSE and WebSocket requests.
      disable-codex-cloaking: false
      # Hold back the frames that carry nothing the client has seen - the handshake (response.created,
      # response.in_progress, the websocket metadata frames), keepalive heartbeats, and the *.added
      # announcements of an item or part that is still empty - until the upstream emits its first
      # generated event. Anything else, including a server-side tool item such as web_search_call and
      # any frame not on that list, releases the stream immediately. On the SSE transport the lines that
      # are not `data:` frames - comments, `event:` lines, blank separators - are held alongside them.
      # The hold is bounded by a frame budget and a 1 MiB byte budget, not by wall-clock time: an
      # upstream that trickles frames holds the response headers for as long as the client will wait.
      # Why: the upstream smuggles `server_is_overloaded` rejections *inside* an HTTP 200 stream,
      # right after those handshake events, instead of returning 503 on the wire. Buffering them
      # keeps the downstream response headers uncommitted long enough to transparently retry on
      # another credential. Only overload/rate-limit rejections trigger failover; every other terminal
      # failure is still delivered in-stream exactly as before. One pre-existing behaviour is worth
      # knowing, because this option makes the window it lives in much longer: if the stream ends while
      # the bootstrap is still holding, the attempt ends instead of the error reaching the client, and
      # whether another credential is then tried depends on how it ended. A clean end with no terminal
      # event is request-scoped on SSE, so nothing else is tried; a websocket close, or a transport error
      # such as a dropped connection on either transport, is not, so the request may be retried on
      # another credential. None of that is new, but before this option the hold ended at the first
      # keepalive, so it was rare; now it can span the whole reasoning phase.
      # Trade-off: response headers are delayed until generation starts. Because heartbeats are held
      # too, the delay now ends at the first generated token rather than at the first heartbeat. The
      # budget bounds how much is held, not how long: 48 SSE lines, which measures out as 15 heartbeats
      # of the three-line event:/data:/blank shape, 23 of a two-line ": keepalive" comment followed by
      # its blank separator, or 47 of a bare ": keepalive" with no separator - one short of the obvious
      # division, because the rejection frame's own event: line comes out of the same budget before its
      # data: line is parsed. An upstream that sends the rejection as a bare data: line with no event:
      # line gets the round number instead. At a 10s upstream heartbeat that is 150s, 230s or 470s of
      # uncommitted response headers depending on the framing the upstream picks, all of it past nginx's
      # 60s default proxy_read_timeout, so raise the timeouts in front of the proxy before enabling this.
      # Those seconds bound what the buffer holds, not when the response headers are committed. Headers
      # are committed on the first chunk the downstream translator actually produces, so for a format
      # that renders the handshake as nothing - Chat Completions and Gemini do - they stay uncommitted
      # past the budget, until the first generated token. That is not specific to the budget: any frame
      # that releases the buffer has always behaved this way.
      # The websocket transport spends the same 48 differently - one per message read, whether the loop
      # holds it or skips it, with no framing to divide by - so there it is 48 heartbeats, about 480s.
      # Two cases no budget covers: a websocket peer that sends only ping frames, which the library
      # answers inside the read call, leaving only the 5 minute websocket read deadline; and an upstream
      # that stops mid-line on SSE, where the scanner never returns and only the request context ends the
      # wait. Neither is made worse by this option - with it off the same stalled line stalls the
      # conductor instead, which waits on the same context - but a client-side request timeout, not
      # proxy_read_timeout, is what bounds them.
      # Default: false
      stream-bootstrap-buffering: false
      # Optional maximum duration to hold back uncommitted response headers during bootstrap buffering.
      # When set (e.g. "20s"), if the time ceiling is reached before the first generated token,
      # the stream is released to the client and further in-stream overloads are delivered rather
      # than failed over. This bounds how long trickled heartbeats or early empty frames can delay
      # response headers before streaming begins.
      # Recommendation: If your CPA is deployed behind a reverse proxy with a strict read timeout
      # (e.g. Nginx default proxy_read_timeout 60s or Cloudflare 100s timeout), setting this to "20s"
      # is strongly recommended to guarantee headers commit well before proxy timeouts while retaining
      # a comfortable 20s window to fail over early scheduling overloads.
      # Note: The timeout check is evaluated as upstream frames arrive; it never aborts the upstream
      # connection. Downstream headers are committed as soon as the downstream translator emits chunks
      # (for formats that render handshake/heartbeats, headers commit immediately on release; for
      # formats like Chat Completions and Gemini that render nothing until the first text token, headers
      # commit when that first token arrives).
      # When unset or set to "0", "0s", "none", "unlimited", "disabled", "off", or "never", no time ceiling
      # is applied, and buffering relies purely on the 48-frame and 1MB byte budget.
      # Default: "0" (unlimited)
      stream-bootstrap-timeout: "0"
      # When true, enable opt-in compatibility for orphan Codex delegation outputs.
      # Converts orphan function_call_output items from codex_app/create_thread and
      # codex_app/send_message_to_thread (which lack a valid call_id or matching function_call)
      # into standard user messages across Responses and non-Codex protocols when the request
      # header contains X-Openai-Subagent: collab_spawn.
      orphan-delegation-compatibility: false
      # When true, scope Codex usage_limit_reached quota cooldowns to the requested model rather
      # than cooling down the entire credential across all sibling models.
      # Default: false
      model-level-cooling: false
      # Terminate and relay Codex Live WebRTC audio and DataChannel traffic in this process.
      # This requires inbound UDP reachability. Keep disabled to preserve direct media behavior.
      live-media-relay:
        enabled: false
        # Maximum concurrent media sessions. Zero uses the default of 32.
        max-sessions: 32
        # Reject downstream SDP candidates that target private, loopback, link-local, or unspecified IPs.
        # Keep false for local or trusted-network Codex Desktop connections.
        disable-private-remote-ips: false
        # Public IPv4 or IPv6 address advertised when CPA is behind 1:1 NAT.
        public-ip: ""
        # Optional UDP allocation range. Both values must be set together and provide at least two ports per session.
        udp-port-min: 0
        udp-port-max: 0
        # Optional STUN/TURN servers. TURN credentials are never returned by the JSON config API.
        # Without a concrete global/per-auth proxy-url, WebRTC uses normal direct ICE/STUN/TURN connectivity.
        # With http, https, socks5, or socks5h proxy-url, the OpenAI-facing leg is forced through
        # authenticated ICE-TCP over that proxy and never falls back to UDP or a direct connection.
        # The Codex Desktop-facing leg remains direct, and configured ICE servers still apply to it.
        # ice-servers:
        #   - urls:
        #       - "stun:stun.example.com:3478"
        #   - urls:
        #       - "turn:turn.example.com:3478?transport=udp"
        #     username: "user"
        #     credential: "secret"

      # Default headers for Codex OAuth model requests.
      # These are used only for file-backed/OAuth Codex requests when the client
      # does not send the header. `user-agent` applies to HTTP and websocket requests;
      # `beta-features` only applies to websocket requests. They do not apply to api-keys.codex entries.
      # header-defaults:
      #   user-agent: "codex_cli_rs/0.114.0 (Mac OS 14.2.0; x86_64) vscode/1.111.0"
      #   beta-features: "multi_agent"

    # Provider-wide Claude settings.
    claude:
      # When true, scope quota cooldowns to the requested model rather than cooling down
      # the entire credential across all sibling models. Default is false.
      model-level-cooling: false

      # When true, disable Claude OAuth request cloaking (the Claude Code CLI disguise and
      # system prompt replacement), so the original system prompt is passed through to Claude as-is.
      # Individual OAuth/token files can override this via a "cloak_mode" value.
      # Default false keeps the per-client "auto" behavior (cloak only non-Claude-Code clients).
      # API-key credentials use api-keys.claude[].keys[].cloak.mode separately.
      disable-claude-cloak-mode: false

      # Claude Code compatibility settings.
      claude-code:
        # When true, return original model IDs in Anthropic model list responses instead of cloaked IDs.
        disable-cloaking-model-list: false

      # Anthropic-Beta is assembled per request rather than sent as a fixed list, matching
      # Claude Code: context-1m sits right after claude-code, mid-conversation-system
      # is added only for models that accept a role=system turn, advanced-tool-use only when
      # the request uses tool search (deferred tools) or another advanced tool-use feature,
      # afk-mode sits between fast-mode and extended-cache-ttl, and server-side-fallback / fallback-credit /
      # structured-outputs trail effort. On direct api.anthropic.com a caller may only ask for
      # betas real Claude Code also sends, and they are placed at their observed positions;
      # anything else is dropped so the outgoing set stays one a real client could produce.
      # Other Anthropic-compatible upstreams still forward caller betas verbatim.
      #
      # Default headers for Claude OAuth requests. Update only after measuring a new Claude Code release.
      # Unconfirmed clients use this CLI baseline. Verified native Claude Code CLI, sdk-cli,
      # and VSCode requests preserve their measured entrypoint when the Claude Code version is a
      # patch release in the configured major/minor line at or above this baseline. Older versions
      # and newer major/minor lines fall back to the baseline until measured. In legacy mode,
      # timeout is a fallback and
      # verified native OS/arch values remain client-supplied. When stabilize-device-profile is
      # enabled, OS/arch are pinned to the values below and cached profiles remain constrained to
      # the same exact software baseline rather than learning newer client versions.
      # header-defaults:
      #   user-agent: "claude-cli/2.1.280 (external, cli)"
      #   package-version: "0.112.1"
      #   runtime-version: "v26.3.0"
      #   os: "MacOS"
      #   arch: "arm64"
      #   timeout: "600"
      #   timezone: "Asia/Singapore"  # fallback IANA timezone for cloaked currentDate; a credential JSON "timezone" takes priority
      #   stabilize-device-profile: false  # optional, default false; set true to enable per-auth fingerprint pinning

    # Antigravity provider behavior.
    antigravity:
      # sensitive-words:              # optional: words to obfuscate with zero-width characters in system instructions
      #   - "API"
      #   - "proxy"
      # connection-pool:              # optional: upstream HTTP connection pool settings
      #   enabled: false             # whether to enable connection pooling (default: false)
      #   idle-conn-timeout: "30s"    # idle keep-alive timeout (default: 30s, capped at 210s)
      #   max-idle-conns-per-host: 2  # max idle connections per host per credential (default: 2)
      # Use credits as a last resort after free-tier Claude quota is exhausted.
      antigravity-credits: true

      # Signature cache validation for thinking blocks (Antigravity/Claude).
      # When true (default), cached signatures are preferred and validated.
      # When false, client signatures are used directly after normalization (bypass mode for testing).
      # signature-cache-enabled: true

      # Bypass mode signature validation strictness (only applies when signature cache is disabled).
      # When true, validates full Claude protobuf tree (Field 2 -> Field 1 structure).
      # When false (default), only checks R/E prefix + base64 + first byte 0x12.
      # signature-bypass-strict: false

    # xAI provider behavior.
    xai:
      # When true, inject the native x_search tool when the request does not declare it.
      # The injected tool is also added to tool_choice.allowed_tools when applicable.
      inject-x-search: false

    # Devin provider behavior.
    # devin:
    #   sensitive-words:             # optional: words to obfuscate with zero-width characters in system instructions and prompts
    #     - "API"
    #     - "proxy"

# Image and video behavior.
multimedia:
  # disable-image-generation supports: false (default), true, "chat", or "passthrough".
  # - true: disable image_generation everywhere (also returns 404 for /v1/images/generations and /v1/images/edits).
  # - "chat": disable image_generation injection on non-images endpoints, but keep /v1/images/generations and /v1/images/edits enabled.
  # - "passthrough": never inject or strip image_generation on non-images endpoints (forward the client payload unchanged); behaves like "chat" on /v1/images/* endpoints.
  disable-image-generation: false

  # Base model used by the legacy hosted image_generation tool path when a Codex image request is not proxied directly through the Image API.
  # Must start with "gpt-" (case-insensitive). If unset or invalid, defaults to "gpt-5.4-mini".
  # gpt-image-2-base-model: "gpt-5.4-mini"

  # How long video IDs returned by /openai/v1/videos and xAI video creation stay bound
  # to the credential that created them. Default: 3h.
  video-result-auth-cache-ttl: "3h"

# Application logs, request logs, usage aggregation, and profiling.
observability:
  logs:
    # Enable debug logging
    debug: false

    # When true, write application logs to rotating files instead of stdout
    logging-to-file: false

    # Maximum total size (MB) of log files under the logs directory. When exceeded, the oldest log
    # files are deleted until within the limit. Set to 0 to disable.
    logs-max-total-size-mb: 0

    # Maximum number of error log files retained when request logging is disabled.
    # When exceeded, the oldest error log files are deleted. Default is 10. Set to 0 to disable cleanup.
    error-logs-max-files: 10

    # Record proxy request/response logs. Management requests are excluded.
    request-log: false

  usage:
    # When false, disable in-memory usage statistics aggregation
    usage-statistics-enabled: false

    # How long (in seconds) usage queue items are retained in memory for the Management API.
    # The local Redis RESP usage output is disabled.
    # Default: 60. Max: 3600.
    redis-usage-queue-retention-seconds: 60

  # Enable pprof HTTP debug server (host:port). Keep it bound to localhost for safety.
  pprof:
    enable: false
    addr: "127.0.0.1:8316"

# Standard dynamic library plugins are trusted in-process code. They are disabled by default.
# Build Go examples with go build -buildmode=c-shared for the target GOOS/GOARCH.
# Other languages can implement the same C ABI and JSON method protocol.
# Plugin executors require a matching auth record with the same provider key.
# If the same provider is configured as OpenAI-compatible, the native executor wins.
# Plugin command-line flags and Management API routes are optional capabilities.
# Existing native flags/routes and higher-priority plugin flags/routes cannot be replaced.
# Plugin list Management API reads Logo and ConfigFields from plugin metadata for management UI display.
# Per-plugin enabled only controls plugins.configs.<pluginID>.enabled and does not implicitly change global plugins.enabled.
plugins:
  enabled: false
  dir: "plugins"
  # Additional plugin store registries. The built-in official registry is always included.
  # store-sources:
  #   - "https://example.com/cliproxy-plugins/registry.json"
  # Optional plugin store auth rules. Secrets are read from environment variables.
  # Tokens are not stored in plugin manifests or node status.
  # store-auth:
  #   - match: "https://plugins.example.com/bearer/"
  #     apply-to: ["registry", "artifact"]
  #     type: "bearer"
  #     token-env: "CLIPROXY_PLUGIN_STORE_TOKEN"
  #     allow-insecure: false
  #   - match: "https://plugins.example.com/basic/"
  #     apply-to: ["registry", "artifact"]
  #     type: "basic"
  #     username-env: "CLIPROXY_PLUGIN_STORE_USER"
  #     password-env: "CLIPROXY_PLUGIN_STORE_PASSWORD"
  #     allow-insecure: false
  #   - match: "https://plugins.example.com/header/"
  #     apply-to: ["registry", "artifact"]
  #     type: "header"
  #     header-name: "X-Plugin-Token"
  #     header-value-env: "CLIPROXY_PLUGIN_STORE_HEADER_TOKEN"
  #     allow-insecure: false
  #   - match: "https://api.github.com/repos/example/"
  #     apply-to: ["registry", "artifact"]
  #     type: "github-token"
  #     token-env: "CLIPROXY_PLUGIN_GITHUB_TOKEN"
  #     allow-insecure: false

  # Home owns this revision; it is not an ordinary editable setting.
  # auth-revision: 0

  configs:
    example:
      enabled: true
      priority: 1
      config1: true
      config2: "string"
      config3: 3
      mode: "safe" # enum example: safe, fast
      config-list: ["a", "b"]
      config-object:
        mode: "safe"

# Legacy compatibility reference (comments only; not part of this v8 template).
# Old files and /v0/management still work without a v8 write. Existing legacy-only
# fields remain in their old locations until a successful v8 configuration write.
# When manually mixing layouts, a present new field wins over its legacy equivalent.
# To deliberately use an old field again, remove its corresponding new field first.
# Client keys moved from the old api-keys list to access.api-keys; the new root
# api-keys is reserved for provider groups. These cannot share one YAML key.
#
# Old spellings shown for reference:
#   host: ""                         # now server.host
#   port: 8317                       # now server.port
#   remote-management:               # now management
#     allow-remote: false
#     secret-key: ""
#   api-keys: ["your-api-key-1"]      # now access.api-keys
#   request-retry: 3                 # now routing.retry.request-retry
#   debug: false                     # now observability.logs.debug
#   proxy-url: ""                    # now requests.proxy-url
#   auth-dir: "~/.cli-proxy-api"     # now oauth.auth-dir
#   codex:                           # now oauth.providers.codex
#     disable-codex-cloaking: false
#   codex-api-key:                   # now api-keys.codex groups with keys
#     - api-key: "your-upstream-key"
#       base-url: "https://codex.example.com"
#
# Compatibility-only quota switches have no new v8 counterpart. They remain
# readable/editable in legacy files and through /v0/management, but are omitted
# from the active v8 template:
#   quota-exceeded:
#     switch-project: true
#     switch-preview-model: true
# antigravity-credits moved to oauth.providers.antigravity.antigravity-credits.
