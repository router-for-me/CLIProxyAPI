  #       alias: "grok-latest"
  #   meta:
  #     - name: "muse-spark-1.3"
  #       alias: "muse-latest"
  #   sample-provider:                  # plugin provider keys are supported for OAuth plugins
  #     - name: "sample-model-latest"
  #       alias: "sample-latest"

  # OAuth provider model settings (per channel)
  # Allows overriding model-level capabilities (such as context window) for OAuth credentials.
