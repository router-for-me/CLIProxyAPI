name: docker-image

on:
  push:
    tags:
      # v* covers the legacy NixLLM tags (e.g. v0.1.3). The unified pattern
      # covers "<core>-<nixllm>" tags (e.g. 7.2.104-0.1.3) so the GHCR image
      # build is triggered for both naming schemes.
      - v*
      - '*.*.*-*.*.*'

permissions:
  contents: read
  packages: write

env:
  APP_NAME: nixllm
  # Image is published to GHCR under the workflow's owner namespace, e.g.
  # ghcr.io/<owner>/nixllm. No registry secrets required: the built-in
  # GITHUB_TOKEN is used (packages: write permission above).
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    # Linux/amd64 only. The runner's host architecture is amd64, so we pin
    # the platform explicitly rather than relying on buildx defaults; this
    # also keeps the produced image unambiguous (no manifest list, no
    # per-arch tags to clean up).
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Generate Build Metadata
        run: |
          IMAGE_TAG="${GITHUB_REF_NAME}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          if [[ "${IMAGE_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # Unified tag "<core>-<nixllm>", e.g. 7.2.104-0.1.3. The first
            # segment is the core CLIProxyAPI version, the second the NixLLM
            # fork version.
            CORE_VERSION="${IMAGE_TAG%%-*}"
            VERSION="${IMAGE_TAG#*-}"
            echo "CORE_VERSION=${CORE_VERSION}" >> $GITHUB_ENV
            echo "VERSION=${VERSION}" >> $GITHUB_ENV
          else
            # Legacy v* tag (e.g. v0.1.3): NixLLM version is the tag itself and
            # the core version comes from the nearest v7.* git tag.
            echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
            echo "CORE_VERSION=$(git describe --tags --match 'v7.*' --abbrev=0 2>/dev/null | sed 's/^v//')" >> $GITHUB_ENV
          fi
          echo COMMIT=`git rev-parse --short HEAD` >> $GITHUB_ENV
          echo BUILD_DATE=`date -u +%Y-%m-%dT%H:%M:%SZ` >> $GITHUB_ENV
      - name: Lowercase the image owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            CORE_VERSION=${{ env.CORE_VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ env.APP_NAME }}:latest
