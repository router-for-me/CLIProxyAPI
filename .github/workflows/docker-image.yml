name: docker-image

on:
  push:
    tags:
      - v*

permissions:
  contents: read
  packages: write

env:
  APP_NAME: nixllm
  # Image is published to GHCR under the workflow's owner namespace, e.g.
  # ghcr.io/<owner>/nixllm. No registry secrets required: the built-in
  # GITHUB_TOKEN is used (packages: write permission above).
  REGISTRY: ghcr.io

jobs:
  docker_amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Generate Build Metadata
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "CORE_VERSION=$(git describe --tags --match 'v7.*' --abbrev=0 2>/dev/null | sed 's/^v//')" >> $GITHUB_ENV
          echo COMMIT=`git rev-parse --short HEAD` >> $GITHUB_ENV
          echo BUILD_DATE=`date -u +%Y-%m-%dT%H:%M:%SZ` >> $GITHUB_ENV
      - name: Lowercase the image owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            CORE_VERSION=${{ env.CORE_VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ env.APP_NAME }}:${{ env.VERSION }}-amd64

  docker_arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Generate Build Metadata
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "CORE_VERSION=$(git describe --tags --match 'v7.*' --abbrev=0 2>/dev/null | sed 's/^v//')" >> $GITHUB_ENV
          echo COMMIT=`git rev-parse --short HEAD` >> $GITHUB_ENV
          echo BUILD_DATE=`date -u +%Y-%m-%dT%H:%M:%SZ` >> $GITHUB_ENV
      - name: Lowercase the image owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            CORE_VERSION=${{ env.CORE_VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ env.APP_NAME }}:${{ env.VERSION }}-arm64

  docker_manifest:
    runs-on: ubuntu-latest
    needs:
      - docker_amd64
      - docker_arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Generate Build Metadata
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
      - name: Lowercase the image owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push multi-arch manifests
        env:
          OWNER: ${{ steps.owner.outputs.name }}
        run: |
          IMAGE="${REGISTRY}/${OWNER}/${APP_NAME}"
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
      - name: Cleanup per-arch tags
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ steps.owner.outputs.name }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${OWNER}/${APP_NAME}"
          # GHCR container package tag deletion uses the packages API.
          # DELETE /orgs/{owner}/packages/container/{package_name}/tags/{tag_name}
          # (for user-owned packages, /users/{owner}/...). ${OWNER} here resolves
          # to the owning user or org; try the user endpoint first, then org.
          delete_tag() {
            local tag="$1"
            local code
            code="$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/packages/container/${APP_NAME}/tags/${tag}" || true)"
            if [ "${code}" = "204" ] || [ "${code}" = "404" ]; then
              echo "GHCR tag removed (or missing): ${IMAGE}:${tag} (HTTP ${code})"
              return 0
            fi
            # Fall back to the org endpoint.
            code="$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/${OWNER}/packages/container/${APP_NAME}/tags/${tag}" || true)"
            if [ "${code}" = "204" ] || [ "${code}" = "404" ]; then
              echo "GHCR tag removed (or missing): ${IMAGE}:${tag} (HTTP ${code})"
              return 0
            fi
            echo "GHCR tag delete failed: ${IMAGE}:${tag} (HTTP ${code})"
            return 0
          }

          delete_tag "${VERSION}-amd64"
          delete_tag "${VERSION}-arm64"
