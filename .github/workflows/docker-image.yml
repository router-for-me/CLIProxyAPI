name: docker-image
run-name: >-
  docker-image tag=${{ inputs.tag || github.ref_name }}
  commit=${{ inputs.commit || github.sha }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v8.0.71-dc1'
        required: true
        type: string
      commit:
        description: 'Exact commit the supplied tag must resolve to'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository_owner }}/cli-proxy-api

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'marlon-costa-dc/cliproxy' && github.ref == 'refs/heads/dc-use'
    # GitHub-hosted runner: the workflow already uses QEMU for linux/arm64, so a
    # standard ubuntu runner builds both platforms. The previous self-hosted
    # 'cliproxy' runner is offline, which left every docker-image run queued
    # forever (dc9/dc10/dc11 never built). Fall back here; when the self-hosted
    # host returns it can be re-added as an alternative runner group.
    runs-on: ubuntu-latest
    steps:
      - name: Resolve build ref
        id: ref
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          REF="$RELEASE_TAG"
          if [ -z "${REF}" ]; then REF="${GITHUB_REF_NAME}"; fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify the release identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: bash .github/scripts/verify-fork-release.sh "$RELEASE_TAG" "$RELEASE_COMMIT"
      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image names
        id: img
        run: |
          GHCR_IMG="${GHCR_REGISTRY}/${GHCR_IMAGE_NAME}"
          GHCR_IMG_LC="$(echo "${GHCR_IMG}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "ghcr_ref=${GHCR_IMG_LC}"
          } >> "$GITHUB_OUTPUT"

      - name: Build metadata
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="$RELEASE_TAG"
          COMMIT="$(git rev-parse HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "version=${VERSION}"
            echo "commit=${COMMIT}"
            echo "build_date=${BUILD_DATE}"
          } >> "$GITHUB_OUTPUT"

      - name: Build tag list
        id: tags
        env:
          GHCR_REF: ${{ steps.img.outputs.ghcr_ref }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo "tags<<EOF"
            echo "${GHCR_REF}:${VERSION}"

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.revision=${{ steps.meta.outputs.commit }}

      - name: Summary
        env:
          GHCR_REF: ${{ steps.img.outputs.ghcr_ref }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo "## Published"
            echo "- \`${GHCR_REF}:${VERSION}\`"

          } >> "$GITHUB_STEP_SUMMARY"
