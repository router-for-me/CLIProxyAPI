name: Sync Fork Release Tag
run-name: sync-fork-release ref=${{ github.ref_name }} commit=${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-release-tag
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tag:
    if: github.repository == 'marlon-costa-dc/cliproxy' && github.ref == 'refs/heads/dc-use'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "cliproxy-release[bot]"
          git config user.email "cliproxy-release@users.noreply.github.com"

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/router-for-me/CLIProxyAPI.git
          git fetch --no-tags upstream main

      - name: Create and bind the fork release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # shellcheck disable=SC1091
          . ./.fork-upstream.env
          HEAD_COMMIT="$(git rev-parse HEAD)"
          RELEASE_REF="${GITHUB_REF_NAME}"

          case "${RELEASE_REF}" in
            dc-use) ;;
            *)
              echo "Release dispatch is allowed only from dc-use; got ${RELEASE_REF}." >&2
              exit 1
              ;;
          esac

          if ! printf '%s' "${UPSTREAM_TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid UPSTREAM_TAG in .fork-upstream.env" >&2
            exit 1
          fi
          if ! printf '%s' "${UPSTREAM_COMMIT}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Invalid UPSTREAM_COMMIT in .fork-upstream.env" >&2
            exit 1
          fi
          git fetch --no-tags upstream "refs/tags/${UPSTREAM_TAG}:refs/upstream-tags/${UPSTREAM_TAG}"
          if [ "$(git rev-parse "refs/upstream-tags/${UPSTREAM_TAG}^{commit}")" != "${UPSTREAM_COMMIT}" ]; then
            echo "The upstream tag does not resolve to the recorded commit." >&2
            exit 1
          fi
          if [ "$(git ls-remote origin refs/heads/dc-use | cut -f1)" != "${HEAD_COMMIT}" ]; then
            echo "Only the current dc-use tip can be released." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${UPSTREAM_COMMIT}" "${HEAD_COMMIT}"; then
            echo "${UPSTREAM_COMMIT} is not contained in ${HEAD_COMMIT}; refusing to tag." >&2
            exit 1
          fi

          # Dispatch returns before a workflow starts, so ignore all prior runs
          # with the same tag/SHA and wait for the new run's conclusion.
          dispatch_and_watch() {
            local workflow="$1" title="$2" tag="$3" commit="$4"
            local before run_id=""
            before="$(gh run list --workflow "$workflow" --event workflow_dispatch \
              --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            before="${before:-0}"
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_REF" \
              -f tag="$tag" -f commit="$commit"

            for _ in $(seq 1 20); do
              run_id="$(gh run list --workflow "$workflow" --event workflow_dispatch \
                --limit 20 --json databaseId,displayTitle \
                | jq -r --arg title "$title" --argjson before "$before" \
                  'first(.[] | select(.displayTitle == $title and .databaseId > $before) | .databaseId) // empty')"
              if [ -n "$run_id" ]; then
                printf -- '- %s: %s\n' "$workflow" "$run_id" >> "$GITHUB_STEP_SUMMARY"
                gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
                return
              fi
              sleep 5
            done
            echo "Unable to identify the new run for $title" >&2
            return 1
          }

          dispatch_downstream() {
            local tag="$1" commit="$2"
            printf '## Fork release %s at %s\n' "$tag" "$commit" >> "$GITHUB_STEP_SUMMARY"
            # A public archive release means both artifact paths completed.
            dispatch_and_watch docker-image.yml "docker-image tag=$tag commit=$commit" "$tag" "$commit"
            dispatch_and_watch release.yaml "release tag=$tag commit=$commit" "$tag" "$commit"
          }

          # The fork publishes on the `-dc` line (v8.0.71-dc1), so the tag
          # search has to see those. Globbing "${UPSTREAM_TAG}-[0-9]*" matched
          # only bare numeric suffixes, missed every -dc tag, and restarted the
          # counter at 0 -- emitting a tag OLDER than what production runs.
          latest_fork_tag() {
            git tag --merged HEAD --list "${UPSTREAM_TAG}-dc[0-9]*" --sort=-v:refname | head -1
          }

          next_fork_tag() {
            local latest="$1"
            local suffix="1"

            if [ -n "${latest}" ]; then
              # v8.0.71-dc1 -> dc1 -> 1
              suffix="${latest##*-dc}"
              suffix="$((suffix + 1))"
            fi

            printf '%s-dc%s' "${UPSTREAM_TAG}" "${suffix}"
          }

          has_release_relevant_changes() {
            local base_commit="$1"
            local changed

            # No `grep -q` terminating this pipe. Under `set -o pipefail`, a
            # short-circuiting reader closes the pipe, the upstream grep dies
            # with SIGPIPE, and its non-zero status becomes the pipeline's --
            # so a large changeset was reported as "no changes" and the release
            # was silently skipped. The trailing `|| true` keeps the legitimate
            # empty case (grep exits 1) from tripping `set -e`.
            changed="$(git diff --name-only "${base_commit}..HEAD" \
              | grep -Ev '^(\.github/|docs/|plans/|.*\.md$)' || true)"

            [ -n "${changed}" ]
          }

          LATEST_FORK_TAG="$(latest_fork_tag)"
          if [ -n "${LATEST_FORK_TAG}" ]; then
            LATEST_FORK_COMMIT="$(git rev-list -n 1 "${LATEST_FORK_TAG}")"

            if [ "${LATEST_FORK_COMMIT}" = "${HEAD_COMMIT}" ]; then
              if gh release view "${LATEST_FORK_TAG}" --repo "${GITHUB_REPOSITORY}" \
                --json isDraft,assets --jq 'if (.isDraft | not) and any(.assets[]; .name == "checksums.txt") then "published" else "" end' \
                | grep -Fx 'published'; then
                echo "${LATEST_FORK_TAG} release already exists; nothing to tag."
                exit 0
              fi

              echo "${LATEST_FORK_TAG} tag exists but release is missing; dispatching exact tag and commit."
              dispatch_downstream "${LATEST_FORK_TAG}" "${HEAD_COMMIT}"
              exit 0
            fi

            if ! git merge-base --is-ancestor "${LATEST_FORK_COMMIT}" "${HEAD_COMMIT}"; then
              echo "${LATEST_FORK_TAG} is not an ancestor of HEAD; refusing to guess release tag." >&2
              exit 1
            fi

            if ! has_release_relevant_changes "${LATEST_FORK_COMMIT}"; then
              echo "No release-relevant changes since ${LATEST_FORK_TAG}; nothing to tag."
              exit 0
            fi
          fi

          FORK_TAG="$(next_fork_tag "${LATEST_FORK_TAG}")"
          echo "Creating ${FORK_TAG} for upstream ${UPSTREAM_TAG} at ${HEAD_COMMIT}."
          git tag -a "${FORK_TAG}" -m "CLIProxyAPI ${FORK_TAG} (upstream ${UPSTREAM_TAG} ${UPSTREAM_COMMIT})"
          git push origin "refs/tags/${FORK_TAG}"
          dispatch_downstream "${FORK_TAG}" "${HEAD_COMMIT}"
