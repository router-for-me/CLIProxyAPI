name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false
      - name: Build and test checked-in source
        shell: bash
        run: |
          state="$(mktemp -d "$RUNNER_TEMP/go-tests.XXXXXX")"
          trap 'rm -rf "$state"' EXIT
          mkdir -p "$state/home" "$state/tmp"
          # Do not inherit provider/store credentials or opt-in live-test flags.
          env -i PATH="$PATH" HOME="$state/home" TMPDIR="$state/tmp" \
            GOPATH="$state/gopath" GOCACHE="$state/cache" \
            GOTOOLCHAIN=local GOWORK=off GOENV=off CGO_ENABLED=1 \
            GOMAXPROCS=2 GOFLAGS=-mod=readonly \
            bash -euo pipefail -c '
              go version
              git rev-parse HEAD HEAD^{tree}
              go build -p=2 -o "$TMPDIR/test-output" ./cmd/server
              # Bounded diagnosis of the first full-run failure; these are observations, not gates.
              base=b532db9c4b14addd23bee542f7135a49c979bc6a
              failed_candidate=42aae4051689aca504b4e44221dd2cc4b9464a96
              git fetch --no-tags --depth=1 origin "$base" "$failed_candidate"
              for revision in "$base" "$failed_candidate"; do
                source="$TMPDIR/$revision"
                mkdir "$source"
                git archive "$revision" | tar -x -C "$source"
                git rev-parse "$revision" "$revision^{tree}"
                if (cd "$source" && go test -p=2 -parallel=2 -count=100 -timeout=5m -json \
                  -run "^TestWebsocketRetryBindFailureClearsActiveSessionState$/^Codex_stream$" \
                  ./internal/runtime/executor); then
                  echo "DIAGNOSIS revision=$revision exit=0"
                else
                  echo "DIAGNOSIS revision=$revision exit=$?"
                fi
              done
              # The repaired case and the full suite remain required, with no automatic retry.
              go test -p=2 -parallel=2 -count=100 -timeout=5m -json \
                -run "^TestWebsocketRetryBindFailureClearsActiveSessionState$/^Codex_stream$" \
                ./internal/runtime/executor
              go test -p=2 -parallel=2 -count=1 -timeout=10m -json ./...
            '
      - name: Check source remains unchanged
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
