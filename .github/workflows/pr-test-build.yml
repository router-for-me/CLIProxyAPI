name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Build
        run: |
          go build -o test-output ./cmd/server
          rm -f test-output

  accounting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Accounting tests
        run: |
          go test -race ./sdk/cliproxy/usage ./internal/config
          go test -race ./sdk/cliproxy -run TestServiceAccounting
          go test -race ./test -run 'TestAccounting|TestCancellation|TestSlowOrFailed|TestQuota'
          go vet ./sdk/cliproxy/usage ./internal/config ./sdk/cliproxy
