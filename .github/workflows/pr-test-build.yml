name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    if: contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Claude master boundaries
        run: go test -race ./internal/claudemaster ./cmd/claude-master ./sdk/auth ./sdk/cliproxy/auth ./internal/auth/claude
      - name: Build
        run: |
          go build -o test-output ./cmd/server
          go build -o claude-master-test-output ./cmd/claude-master
