name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Build
        run: |
          go build -o test-output ./cmd/server
          rm -f test-output

  litellm-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Accounting tests
        run: |
          go test -race ./sdk/cliproxy/usage ./internal/config
          go test -race ./sdk/cliproxy -run TestServiceAccounting
          go vet ./sdk/cliproxy/usage ./internal/config ./sdk/cliproxy
      - name: Pinned LiteLLM contract
        env:
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
        run: |
          python -m pip install -r test/litellm/requirements.txt
          python -m pytest -q test/litellm/test_contract.py
