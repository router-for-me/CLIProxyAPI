name: docker-publish

# Builds and publishes a multi-arch Docker image when a version tag is pushed.
# Targets GHCR (ghcr.io/<owner>/cli-proxy-api) using the built-in GITHUB_TOKEN,
# so no Docker registry secrets need to be configured on the repository.
#
# This workflow mirrors .github/workflows/docker-image.yml (which pushes to
# Docker Hub as eceasy/cli-proxy-api and needs the upstream maintainers'
# DOCKERHUB_USERNAME / DOCKERHUB_TOKEN). It is kept as a separate file so that
# merging from upstream does not produce conflicts in docker-image.yml.

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or commit-ish to build (defaults to current ref)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: nixllm
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.ref) || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh

      - name: Generate build metadata
        id: meta
        run: |
          set -euo pipefail
          # Prefer the pushed tag (e.g. v1.2.3); fall back to the git-describe
          # value for workflow_dispatch runs against a non-tagged ref.
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(git describe --tags --always --dirty)"
          fi
          # Core version is derived from the latest upstream-style v7.* tag so
          # the banner shows the CLIProxyAPI base version automatically.
          core_version="$(git describe --tags --match 'v7.*' --abbrev=0 2>/dev/null | sed 's/^v//')"
          core_version="${core_version:-unknown}"
          commit="$(git rev-parse --short HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "core_version=${core_version}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "build_date=${build_date}" >> "$GITHUB_OUTPUT"

      - name: Lowercase the image owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for image labels
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.title=NixLLM
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            CORE_VERSION=${{ steps.meta.outputs.core_version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
