name: proxx-e2e

# proxx: self-update e2e (ADR 0007) on Linux and macOS. Builds real binaries, serves them from a mock
# GitHub release API and upgrades a supervised proxx in place under load.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proxx-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selfupdate:
    name: selfupdate e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: blob:none
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Tests use the committed catalog, so a result does not depend on router-for-me/models@main
      # at run time. release.yaml still refreshes it for shipped binaries.
      - name: Validate committed models catalog
        run: go run ./cmd/validate_codex_models --file internal/registry/models/codex_client_models.json
      - name: Unit tests
        run: go test -race -count=1 ./internal/proxx/... ./internal/managementasset/ ./cmd/proxx-sign/
      - name: Self-update e2e
        env:
          PROXX_E2E: "1"
        run: go test ./test/proxx/selfupdate_e2e/ -run TestE2ESelfUpdate -v -count=1 -timeout 30m
