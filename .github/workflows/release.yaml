name: release

on:
  push:
    # Only our own version tags produce a release. The -upstreamX.Y.Z suffix
    # records the upstream release the tag is aligned to; -upstreamnone marks a
    # fork-only release. Upstream's own vX.Y.Z tags never match, and
    # guard-release-tag.sh rejects any that are pushed by mistake.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-upstream*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish, e.g. v1.0.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  GO_VERSION: '1.26.4'
  # Tag to publish. On a tag push this is the pushed tag; on workflow_dispatch
  # it comes from the required input, because github.ref_name would be a branch.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_NOTES_FILE: docs/releases/${{ inputs.tag || github.ref_name }}.md

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Validate release tag and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-upstream((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)|none)$ ]]
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG^{commit}" origin/main
      - name: Reject tags that belong to upstream
        shell: bash
        run: ops/upstream-intake/guard-release-tag.sh "$RELEASE_TAG"
      - name: Validate curated release notes
        shell: bash
        run: python3 ops/release-notes/validate.py validate "$RELEASE_TAG" "$RELEASE_NOTES_FILE"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Regression gate
        run: bash ops/upstream-intake/verify-absorb.sh

  prepare-release:
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true
      - name: Refuse changes to a published release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases?per_page=100" --paginate --slurp \
            --jq 'add' > /tmp/releases.json
          if jq -e --arg tag "$RELEASE_TAG" \
            'any(.[]; .tag_name == $tag and .draft == false)' /tmp/releases.json; then
            echo "Published releases are immutable; create a new version instead" >&2
            exit 1
          fi
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          updated_notes_file="$(mktemp)"
          trap 'rm -f "$updated_notes_file"' EXIT

          git fetch --force --tags
          previous_tag=""
          if previous_tag_value="$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null)"; then
            previous_tag="$previous_tag_value"
          fi

          render_args=(--repository "$GH_REPO" --output "$updated_notes_file")
          if [[ -n "$previous_tag" ]]; then
            render_args+=(--previous-tag "$previous_tag")
          fi
          python3 ops/release-notes/validate.py render "$RELEASE_TAG" \
            "$RELEASE_NOTES_FILE" "${render_args[@]}"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$updated_notes_file"
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --notes-file "$updated_notes_file"
          fi

  build-hosted:
    permissions:
      contents: write
    name: build ${{ matrix.target }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            asset_arch: amd64
            archive_format: tar.gz
          - target: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            asset_arch: aarch64
            archive_format: tar.gz
          - target: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - target: windows-arm64
            runner: windows-11-arm
            goos: windows
            goarch: arm64
            asset_arch: aarch64
            archive_format: zip
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-
            go-${{ runner.os }}-${{ runner.arch }}-
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          ARCHIVE_FORMAT: ${{ matrix.archive_format }}
        run: |
          set -euo pipefail
          binary_name="cli-proxy-api"
          if [[ "$GOOS" == "windows" ]]; then
            binary_name="cli-proxy-api.exe"
          fi

          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_${GOOS}_${ASSET_ARCH}.${ARCHIVE_FORMAT}"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir"

          CGO_ENABLED=1 GOOS="$GOOS" GOARCH="$GOARCH" go build \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "$archive_dir/$binary_name" ./cmd/server/

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          if [[ "$ARCHIVE_FORMAT" == "zip" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path '${archive_dir}/*' -DestinationPath 'dist/${archive_name}' -Force"
          else
            tar -C "$archive_dir" -czf "dist/$archive_name" "$binary_name" LICENSE README.md README_CN.md config.example.yaml
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPI_*
          if-no-files-found: error
      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/CLIProxyAPI_*.tar.gz dist/CLIProxyAPI_*.zip)
          if [[ ${#assets[@]} -eq 0 ]]; then
            printf 'expected archive assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

  build-linux-glibc:
    permissions:
      contents: write
    name: build linux-${{ matrix.goarch }} glibc
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            goarch: amd64
            asset_arch: amd64
            manylinux_image: quay.io/pypa/manylinux2014_x86_64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            goarch: arm64
            asset_arch: aarch64
            manylinux_image: quay.io/pypa/manylinux2014_aarch64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          MANYLINUX_IMAGE: ${{ matrix.manylinux_image }}
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_linux_${ASSET_ARCH}.tar.gz"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir"

          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e GO_VERSION \
            -e GOARCH \
            -e RELEASE_VERSION \
            -e COMMIT \
            -e BUILD_DATE \
            "$MANYLINUX_IMAGE" \
            bash -euo pipefail -c '
              go_archive="go${GO_VERSION}.linux-${GOARCH}.tar.gz"
              curl -fsSL "https://go.dev/dl/${go_archive}" -o "/tmp/${go_archive}"
              rm -rf /usr/local/go
              tar -C /usr/local -xzf "/tmp/${go_archive}"
              export PATH="/usr/local/go/bin:${PATH}"

              CGO_ENABLED=1 GOOS=linux GOARCH="${GOARCH}" go build -buildvcs=false \
                -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
                -o "'"$archive_dir"'/cli-proxy-api" ./cmd/server/

              glibc_versions="$(readelf --version-info "'"$archive_dir"'/cli-proxy-api" | sed -n "s/.*Name: GLIBC_\([0-9.]*\).*/\1/p" | sort -Vu)"
              if [[ -n "${glibc_versions}" ]]; then
                printf "GLIBC versions:\n%s\n" "${glibc_versions}"
                max_glibc="$(printf "%s\n" "${glibc_versions}" | sort -V | tail -n 1)"
                if [[ "$(printf "2.17\n%s\n" "${max_glibc}" | sort -V | tail -n 1)" != "2.17" ]]; then
                  printf "linux ${GOARCH} binary requires GLIBC_%s, expected GLIBC_2.17 or older\n" "${max_glibc}" >&2
                  exit 1
                fi
              fi
            '

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          tar -C "$archive_dir" -czf "dist/$archive_name" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPI_*
          if-no-files-found: error
      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/CLIProxyAPI_*.tar.gz)
          if [[ ${#assets[@]} -eq 0 ]]; then
            printf 'expected archive assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

  build-linux-no-plugin:
    permissions:
      contents: write
    name: build linux-${{ matrix.goarch }} no-plugin
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64-no-plugin
            goarch: amd64
            asset_arch: amd64
          - target: linux-arm64-no-plugin
            goarch: arm64
            asset_arch: aarch64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Fetch tags
        shell: bash
        run: git fetch --force --tags
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-linux-no-plugin-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-linux-no-plugin-${{ matrix.goarch }}-
            go-linux-no-plugin-
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_linux_${ASSET_ARCH}_no-plugin.tar.gz"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir"

          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build -buildvcs=false \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "$archive_dir/cli-proxy-api" ./cmd/server/

          if readelf -l "$archive_dir/cli-proxy-api" | grep -q 'Requesting program interpreter'; then
            readelf -l "$archive_dir/cli-proxy-api" >&2
            echo "no-plugin linux binary must not require a dynamic interpreter" >&2
            exit 1
          fi

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          tar -C "$archive_dir" -czf "dist/$archive_name" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPI_*
          if-no-files-found: error
      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/CLIProxyAPI_*.tar.gz)
          if [[ ${#assets[@]} -eq 0 ]]; then
            printf 'expected archive assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

  build-freebsd:
    permissions:
      contents: write
    name: build ${{ matrix.target }}
    needs: prepare-release
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ matrix.target }}
      TARGET_GOARCH: ${{ matrix.goarch }}
      ASSET_ARCH: ${{ matrix.asset_arch }}
      ASSET_SUFFIX: ${{ matrix.asset_suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: freebsd-amd64
            goarch: amd64
            asset_arch: amd64
            asset_suffix: ''
            cgo_enabled: true
          - target: freebsd-arm64-no-plugin
            goarch: arm64
            asset_arch: aarch64
            asset_suffix: _no-plugin
            cgo_enabled: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Fetch tags
        run: git fetch --force --tags
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-freebsd-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-freebsd-${{ matrix.goarch }}-
            go-freebsd-
      - name: Generate Build Metadata
        id: metadata
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          commit="$(git rev-parse --short HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "COMMIT=$commit" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$build_date" >> "$GITHUB_ENV"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "build_date=$build_date" >> "$GITHUB_OUTPUT"
      - name: Prepare FreeBSD output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "dist/${TARGET}"
      - name: Install FreeBSD cross-build dependencies
        if: ${{ matrix.cgo_enabled }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld curl
      - name: Build FreeBSD binary with CGO
        if: ${{ matrix.cgo_enabled }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${TARGET}/bin"
          sysroot_dir="/tmp/freebsd-sysroot"
          rm -rf "$sysroot_dir"
          mkdir -p "$sysroot_dir"
          trap 'sudo rm -rf "$sysroot_dir" /tmp/base.txz' EXIT

          case "$TARGET_GOARCH" in
            amd64)
              freebsd_arch="amd64"
              clang_target="x86_64-unknown-freebsd14"
              ;;
            arm64)
              freebsd_arch="arm64"
              clang_target="aarch64-unknown-freebsd14"
              ;;
            *)
              echo "Unsupported FreeBSD architecture: $TARGET_GOARCH" >&2
              exit 1
              ;;
          esac

          urls=(
            "https://download.freebsd.org/releases/${freebsd_arch}/14.4-RELEASE/base.txz"
            "https://archive.freebsd.org/old-releases/${freebsd_arch}/14.4-RELEASE/base.txz"
            "https://archive.freebsd.org/old-releases/${freebsd_arch}/14.3-RELEASE/base.txz"
          )

          downloaded=false
          for url in "${urls[@]}"; do
            echo "Attempting to download FreeBSD base.txz from ${url}..."
            if curl -fsSL --retry 3 --retry-connrefused "$url" -o /tmp/base.txz; then
              echo "Successfully downloaded FreeBSD base.txz from ${url}"
              downloaded=true
              break
            else
              echo "Download failed from ${url}, trying next candidate..."
            fi
          done

          if [[ "$downloaded" != "true" ]]; then
            echo "Error: Failed to download FreeBSD base.txz from all candidate mirrors" >&2
            exit 1
          fi

          echo "Extracting FreeBSD sysroot to ${sysroot_dir}..."
          sudo tar -xf /tmp/base.txz -C "$sysroot_dir"
          rm -f /tmp/base.txz

          echo "Building FreeBSD ${TARGET} binary with CGO..."
          CGO_ENABLED=1 \
          GOOS=freebsd \
          GOARCH="$TARGET_GOARCH" \
          CGO_LDFLAGS="-fuse-ld=lld" \
          CC="clang --target=${clang_target} --sysroot=${sysroot_dir}" \
          go build -buildvcs=false \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "dist/${TARGET}/bin/cli-proxy-api" ./cmd/server/
      - name: Build FreeBSD no-plugin binary
        if: ${{ !matrix.cgo_enabled }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${TARGET}/bin"
          CGO_ENABLED=0 GOOS=freebsd GOARCH="$TARGET_GOARCH" go build -buildvcs=false \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "dist/${TARGET}/bin/cli-proxy-api" ./cmd/server/
      - name: Package FreeBSD archive
        shell: bash
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_freebsd_${ASSET_ARCH}${ASSET_SUFFIX}.tar.gz"
          mkdir -p "$archive_dir"

          echo "Packaging ${archive_name}"
          cp "dist/${TARGET}/bin/cli-proxy-api" "$archive_dir/cli-proxy-api"
          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          tar -C "$archive_dir" -czf "dist/$archive_name" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPI_*
          if-no-files-found: error
      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(dist/CLIProxyAPI_*.tar.gz)
          if [[ ${#assets[@]} -eq 0 ]]; then
            printf 'expected archive assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

  publish-checksums:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs:
      - build-hosted
      - build-linux-glibc
      - build-linux-no-plugin
      - build-freebsd
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify complete assets and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          archives=(CLIProxyAPI_*.tar.gz CLIProxyAPI_*.zip)
          version="${RELEASE_TAG#v}"
          expected=(
            "CLIProxyAPI_${version}_darwin_amd64.tar.gz"
            "CLIProxyAPI_${version}_darwin_aarch64.tar.gz"
            "CLIProxyAPI_${version}_windows_amd64.zip"
            "CLIProxyAPI_${version}_windows_aarch64.zip"
            "CLIProxyAPI_${version}_linux_amd64.tar.gz"
            "CLIProxyAPI_${version}_linux_aarch64.tar.gz"
            "CLIProxyAPI_${version}_linux_amd64_no-plugin.tar.gz"
            "CLIProxyAPI_${version}_linux_aarch64_no-plugin.tar.gz"
            "CLIProxyAPI_${version}_freebsd_amd64.tar.gz"
            "CLIProxyAPI_${version}_freebsd_aarch64_no-plugin.tar.gz"
          )
          diff <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${archives[@]}" | sort)
          sha256sum "${archives[@]}" | sort -k2 > checksums.txt
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download "$RELEASE_TAG" --pattern 'CLIProxyAPI_*' --dir "$verify_dir"
          diff <(printf '%s\n' "${expected[@]}" | sort) <(find "$verify_dir" -type f -exec basename {} \; | sort)
          cp checksums.txt "$verify_dir/"
          (cd "$verify_dir" && sha256sum --check checksums.txt)
          gh release upload "$RELEASE_TAG" checksums.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
