name: release

run-name: release tag=${{ inputs.tag }} commit=${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Qualified fork tag
        type: string
        required: true
      commit:
        description: Full commit SHA for the qualified tag
        type: string
        required: true

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_COMMIT: ${{ inputs.commit }}
  GH_REPO: ${{ github.repository }}
  GO_VERSION: '1.26.10'

jobs:
  verify-release:
    if: github.repository == 'marlon-costa-dc/cliproxy' && github.ref == 'refs/heads/dc-use'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - run: bash .github/scripts/verify-fork-release.sh "$RELEASE_TAG" "$RELEASE_COMMIT"

  build-hosted:
    name: build ${{ matrix.target }}
    needs: verify-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            asset_arch: amd64
            archive_format: tar.gz
          - target: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            asset_arch: aarch64
            archive_format: tar.gz
          - target: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            asset_arch: amd64
            archive_format: zip
          - target: windows-arm64
            runner: windows-11-arm
            goos: windows
            goarch: arm64
            asset_arch: aarch64
            archive_format: zip
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify checked-out commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-
            go-${{ runner.os }}-${{ runner.arch }}-
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "RELEASE_VERSION=${RELEASE_TAG#v}"
            echo "COMMIT=$(git rev-parse HEAD)"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          ARCHIVE_FORMAT: ${{ matrix.archive_format }}
        run: |
          set -euo pipefail
          binary_name="cli-proxy-api"
          if [[ "$GOOS" == "windows" ]]; then
            binary_name="cli-proxy-api.exe"
          fi

          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_${GOOS}_${ASSET_ARCH}.${ARCHIVE_FORMAT}"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir"

          CGO_ENABLED=1 GOOS="$GOOS" GOARCH="$GOARCH" go build \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "$archive_dir/$binary_name" ./cmd/server/

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          if [[ "$ARCHIVE_FORMAT" == "zip" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path '${archive_dir}/*' -DestinationPath 'dist/${archive_name}' -Force"
          else
            tar -C "$archive_dir" -czf "dist/$archive_name" "$binary_name" LICENSE README.md README_CN.md config.example.yaml
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPI_*
          if-no-files-found: error

  build-linux-glibc:
    name: build linux-${{ matrix.goarch }} glibc
    needs: verify-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            goarch: amd64
            asset_arch: amd64
            manylinux_image: quay.io/pypa/manylinux2014_x86_64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            goarch: arm64
            asset_arch: aarch64
            manylinux_image: quay.io/pypa/manylinux2014_aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify checked-out commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "RELEASE_VERSION=${RELEASE_TAG#v}"
            echo "COMMIT=$(git rev-parse HEAD)"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          MANYLINUX_IMAGE: ${{ matrix.manylinux_image }}
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_linux_${ASSET_ARCH}.tar.gz"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir"

          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e GO_VERSION \
            -e GOARCH \
            -e RELEASE_VERSION \
            -e COMMIT \
            -e BUILD_DATE \
            "$MANYLINUX_IMAGE" \
            bash -euo pipefail -c '
              go_archive="go${GO_VERSION}.linux-${GOARCH}.tar.gz"
              curl -fsSL "https://go.dev/dl/${go_archive}" -o "/tmp/${go_archive}"
              rm -rf /usr/local/go
              tar -C /usr/local -xzf "/tmp/${go_archive}"
              export PATH="/usr/local/go/bin:${PATH}"

              CGO_ENABLED=1 GOOS=linux GOARCH="${GOARCH}" go build -buildvcs=false \
                -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
                -o "'"$archive_dir"'/cli-proxy-api" ./cmd/server/

              glibc_versions="$(readelf --version-info "'"$archive_dir"'/cli-proxy-api" | sed -n "s/.*Name: GLIBC_\([0-9.]*\).*/\1/p" | sort -Vu)"
              if [[ -n "${glibc_versions}" ]]; then
                printf "GLIBC versions:\n%s\n" "${glibc_versions}"
                max_glibc="$(printf "%s\n" "${glibc_versions}" | sort -V | tail -n 1)"
                if [[ "$(printf "2.17\n%s\n" "${max_glibc}" | sort -V | tail -n 1)" != "2.17" ]]; then
                  printf "linux ${GOARCH} binary requires GLIBC_%s, expected GLIBC_2.17 or older\n" "${max_glibc}" >&2
                  exit 1
                fi
              fi
            '

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          tar -C "$archive_dir" -czf "dist/$archive_name" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPI_*
          if-no-files-found: error

  build-linux-no-plugin:
    name: build linux-${{ matrix.goarch }} no-plugin
    needs: verify-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64-no-plugin
            goarch: amd64
            asset_arch: amd64
          - target: linux-arm64-no-plugin
            goarch: arm64
            asset_arch: aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify checked-out commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-linux-no-plugin-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-linux-no-plugin-${{ matrix.goarch }}-
            go-linux-no-plugin-
      - name: Generate Build Metadata
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "RELEASE_VERSION=${RELEASE_TAG#v}"
            echo "COMMIT=$(git rev-parse HEAD)"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"
      - name: Build archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.goarch }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_linux_${ASSET_ARCH}_no-plugin.tar.gz"
          rm -rf "dist/${TARGET}"
          mkdir -p "$archive_dir"

          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build -buildvcs=false \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "$archive_dir/cli-proxy-api" ./cmd/server/

          if readelf -l "$archive_dir/cli-proxy-api" | grep -q 'Requesting program interpreter'; then
            readelf -l "$archive_dir/cli-proxy-api" >&2
            echo "no-plugin linux binary must not require a dynamic interpreter" >&2
            exit 1
          fi

          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          tar -C "$archive_dir" -czf "dist/$archive_name" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPI_*
          if-no-files-found: error

  build-freebsd:
    name: build ${{ matrix.target }}
    needs: verify-release
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ matrix.target }}
      TARGET_GOARCH: ${{ matrix.goarch }}
      ASSET_ARCH: ${{ matrix.asset_arch }}
      ASSET_SUFFIX: ${{ matrix.asset_suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: freebsd-amd64
            goarch: amd64
            asset_arch: amd64
            asset_suffix: ''
            cgo_enabled: true
          - target: freebsd-arm64-no-plugin
            goarch: arm64
            asset_arch: aarch64
            asset_suffix: _no-plugin
            cgo_enabled: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify checked-out commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-freebsd-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-freebsd-${{ matrix.goarch }}-
            go-freebsd-
      - name: Generate Build Metadata
        id: metadata
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          commit="$(git rev-parse HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "RELEASE_VERSION=$release_version"
            echo "COMMIT=$commit"
            echo "BUILD_DATE=$build_date"
          } >> "$GITHUB_ENV"
          {
            echo "release_version=$release_version"
            echo "commit=$commit"
            echo "build_date=$build_date"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare FreeBSD output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "dist/${TARGET}"
      - name: Install FreeBSD cross-build dependencies
        if: ${{ matrix.cgo_enabled }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld curl
      - name: Build FreeBSD binary with CGO
        if: ${{ matrix.cgo_enabled }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${TARGET}/bin"
          sysroot_dir="/tmp/freebsd-sysroot"
          rm -rf "$sysroot_dir"
          mkdir -p "$sysroot_dir"
          trap 'sudo rm -rf "$sysroot_dir" /tmp/base.txz' EXIT

          case "$TARGET_GOARCH" in
            amd64)
              freebsd_arch="amd64"
              clang_target="x86_64-unknown-freebsd14"
              ;;
            arm64)
              freebsd_arch="arm64"
              clang_target="aarch64-unknown-freebsd14"
              ;;
            *)
              echo "Unsupported FreeBSD architecture: $TARGET_GOARCH" >&2
              exit 1
              ;;
          esac

          urls=(
            "https://download.freebsd.org/releases/${freebsd_arch}/14.4-RELEASE/base.txz"
            "https://archive.freebsd.org/old-releases/${freebsd_arch}/14.4-RELEASE/base.txz"
            "https://archive.freebsd.org/old-releases/${freebsd_arch}/14.3-RELEASE/base.txz"
          )

          downloaded=false
          for url in "${urls[@]}"; do
            echo "Attempting to download FreeBSD base.txz from ${url}..."
            if curl -fsSL --retry 3 --retry-connrefused "$url" -o /tmp/base.txz; then
              echo "Successfully downloaded FreeBSD base.txz from ${url}"
              downloaded=true
              break
            else
              echo "Download failed from ${url}, trying next candidate..."
            fi
          done

          if [[ "$downloaded" != "true" ]]; then
            echo "Error: Failed to download FreeBSD base.txz from all candidate mirrors" >&2
            exit 1
          fi

          echo "Extracting FreeBSD sysroot to ${sysroot_dir}..."
          sudo tar -xf /tmp/base.txz -C "$sysroot_dir"
          rm -f /tmp/base.txz

          echo "Building FreeBSD ${TARGET} binary with CGO..."
          CGO_ENABLED=1 \
          GOOS=freebsd \
          GOARCH="$TARGET_GOARCH" \
          CGO_LDFLAGS="-fuse-ld=lld" \
          CC="clang --target=${clang_target} --sysroot=${sysroot_dir}" \
          go build -buildvcs=false \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "dist/${TARGET}/bin/cli-proxy-api" ./cmd/server/
      - name: Build FreeBSD no-plugin binary
        if: ${{ !matrix.cgo_enabled }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${TARGET}/bin"
          CGO_ENABLED=0 GOOS=freebsd GOARCH="$TARGET_GOARCH" go build -buildvcs=false \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o "dist/${TARGET}/bin/cli-proxy-api" ./cmd/server/
      - name: Package FreeBSD archive
        shell: bash
        run: |
          set -euo pipefail

          archive_dir="dist/${TARGET}/archive"
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_freebsd_${ASSET_ARCH}${ASSET_SUFFIX}.tar.gz"
          mkdir -p "$archive_dir"

          echo "Packaging ${archive_name}"
          cp "dist/${TARGET}/bin/cli-proxy-api" "$archive_dir/cli-proxy-api"
          cp LICENSE README.md README_CN.md config.example.yaml "$archive_dir/"
          tar -C "$archive_dir" -czf "dist/$archive_name" cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/CLIProxyAPI_*
          if-no-files-found: error

  publish-checksums:
    runs-on: ubuntu-latest
    needs:
      - build-hosted
      - build-linux-glibc
      - build-linux-no-plugin
      - build-freebsd
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish final checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          archives=(CLIProxyAPI_*.tar.gz CLIProxyAPI_*.zip)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "No release archives found" >&2
            exit 1
          fi
          sha256sum "${archives[@]}" | sort -k2 > checksums.txt
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "${archives[@]}" checksums.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false
