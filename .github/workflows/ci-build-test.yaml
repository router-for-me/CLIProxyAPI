name: ci-build-test

on:
  workflow_dispatch:
  push:
    branches:
      - 'opt/reduce-size-*'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Build with make release
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          make release
          echo "=== Built binary details ==="
          ls -lh bin/server
          wc -c < bin/server
          ./bin/server --help

      - name: Verify binary properties
        run: |
          set -euo pipefail
          file bin/server
          if readelf -l bin/server | grep -q 'Requesting program interpreter'; then
            echo "Error: binary is dynamically linked" >&2
            exit 1
          fi
          echo "Binary is fully statically linked."
