name: austin-ci-ghcr

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/austinhmh/cli-proxy-api-plus

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted_files="$(gofmt -l .)"
          if [[ -n "${unformatted_files}" ]]; then
            printf 'The following Go files require gofmt:\n%s\n' "${unformatted_files}"
            exit 1
          fi

      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh

      - name: Run unit tests
        run: go test -p "$(nproc)" ./...

      - name: Run Claude prompt-cache race tests
        env:
          CGO_ENABLED: "1"
        run: |
          go test -race -count=1 ./internal/runtime/executor/helps
          go test -race -count=1 \
            -run '^(TestApplyClaudeHeadersWithSession|TestClaudePromptCache|TestClaudeCacheDiagnostics|TestClaudeDiagnosticsFallback|TestClaudeExecutorCountTokens|TestClaudeExecutorExecuteStreamRetainsStartedCacheStateUntilStreamEnds|TestClaudeExecutor_ExecuteOpenAINonStreamUsesSSEHeaders)' \
            ./internal/runtime/executor

      - name: Vet Claude identity package
        run: go vet ./sdk/cliproxy/auth

      - name: Verify server build
        run: |
          go build -p "$(nproc)" -o test-output ./cmd/server
          rm -f test-output

  image:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=sha-

      - name: Generate build metadata
        shell: bash
        run: |
          echo "VERSION=sha-${GITHUB_SHA}" >> "${GITHUB_ENV}"
          echo "COMMIT=${GITHUB_SHA}" >> "${GITHUB_ENV}"
          echo "BUILD_DATE=$(git show -s --format=%cI "${GITHUB_SHA}")" >> "${GITHUB_ENV}"

      - name: Build Docker image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker image startup and metadata
        shell: bash
        run: |
          set -euo pipefail
          image_reference="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          container_name="cli-proxy-api-smoke-${GITHUB_RUN_ID}"
          trap 'docker rm -f "${container_name}" >/dev/null 2>&1 || true' EXIT

          cat > "${RUNNER_TEMP}/ci-smoke-config.yaml" <<'EOF'
          host: "0.0.0.0"
          port: 8317
          remote-management:
            allow-remote: false
            secret-key: ""
            disable-control-panel: true
          auth-dir: "/tmp/cli-proxy-api-auths"
          api-keys:
            - "ci-smoke-key"
          EOF

          docker run --detach \
            --name "${container_name}" \
            --publish 127.0.0.1:18317:8317 \
            --volume "${RUNNER_TEMP}/ci-smoke-config.yaml:/tmp/ci-smoke-config.yaml:ro" \
            "${image_reference}" \
            ./CLIProxyAPI --config /tmp/ci-smoke-config.yaml --local-model

          healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:18317/healthz >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [[ "${healthy}" != "true" ]]; then
            docker logs "${container_name}"
            exit 1
          fi

          container_logs="$(docker logs "${container_name}" 2>&1)"
          printf '%s\n' "${container_logs}"
          grep -Fxq -- "CLIProxyAPI Version: ${VERSION}, Commit: ${COMMIT}, BuiltAt: ${BUILD_DATE}" <<< "${container_logs}"

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.repository_owner == 'austinhmh'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Publish verified Docker image
        if: github.event_name != 'pull_request' && github.repository_owner == 'austinhmh'
        shell: bash
        run: |
          set -euo pipefail
          image_reference="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker push "${image_reference}"

      - name: Publish image coordinates
        if: github.event_name != 'pull_request' && github.repository_owner == 'austinhmh'
        shell: bash
        run: |
          {
            echo "## GHCR image"
            echo
            echo "- Tag: \`${IMAGE_NAME}:sha-${GITHUB_SHA}\`"
            echo "- Local image ID: \`$(docker image inspect --format '{{.Id}}' "${IMAGE_NAME}:sha-${GITHUB_SHA}")\`"
          } >> "${GITHUB_STEP_SUMMARY}"
