# Alternative to config.fragment.yaml: preserve client-selected effort.
# Merge into an existing config and remove an old unconditional High override.
config-version: 8
multimedia:
  disable-image-generation: "passthrough"
requests:
  payload:
    default:
      - models:
          - name: "gpt-6.1-sol"
            protocol: "codex"
        params:
          "reasoning.effort": "medium"
    override:
      # Enable CLAUDE_CODE_GATEWAY_HINT_HEADERS=1 in the native launch profile.
      # Preserve the old High policy for auxiliary reviews; main work passes through.
      - models:
          - name: "gpt-6.1-sol"
            protocol: "codex"
            from-protocol: "claude"
            headers:
              x-claude-code-request-class: "auxiliary"
        params:
          "reasoning.effort": "high"
      # Fallback for already-running clients without native request-class hints.
      - models:
          - name: "gpt-6.1-sol"
            protocol: "codex"
            from-protocol: "claude"
            match:
              - "input.#": 2
                "input.0.role": "developer"
                "input.1.role": "user"
                "input.1.content.0.text": "<transcript>\n"
            not-exist:
              - "tools.0"
        params:
          "reasoning.effort": "high"
      # Last matching override wins: only recognized stage one uses Medium.
      - models:
          - name: "gpt-6.1-sol"
            protocol: "codex"
            from-protocol: "claude"
            match:
              - "input.#": 2
                "input.0.role": "developer"
                "input.1.role": "user"
                "input.1.content.0.text": "<transcript>\n"
            exist:
              - 'input.1.content.#(text%"*Stage 1 does NOT apply user intent or ALLOW exceptions*").text'
            not-exist:
              - "tools.0"
        params:
          "reasoning.effort": "medium"
