services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: cli-proxy-api
    environment:
      DEPLOY: ${DEPLOY:-}
      WRITABLE_PATH: /var/data/cli-proxy-api
    ports:
      - "8317:8317"
      # OAuth callback ports (only needed for login flows, can be removed for proxy-only deployments)
      - "8085:8085"   # Gemini OAuth
      - "1455:1455"   # Codex OAuth
      - "54545:54545" # Claude/Anthropic OAuth
      - "51121:51121" # Antigravity OAuth
      - "11451:11451" # Kimi OAuth
    volumes:
      # 配置文件:默认使用生产配置;在 .env 设置
      # CLI_PROXY_CONFIG_PATH=./config.yaml 可切回本地开发配置。
      - ${CLI_PROXY_CONFIG_PATH:-./config.prod.yaml}:/CLIProxyAPI/config.yaml
      - ${CLI_PROXY_DATA_PATH:-./data}:/var/data/cli-proxy-api
      # OAuth 凭证:同时可通过宿主机 ./data/auths 访问,
      # 单独挂出来方便备份和查看。
      - ./auths:/var/data/cli-proxy-api/auths
    restart: unless-stopped
