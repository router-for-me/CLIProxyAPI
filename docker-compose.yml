services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: cli-proxy-api
    env_file:
      - .env
    environment:
      DEPLOY: ${DEPLOY:-}
    ports:
      - "8317:8317"
      - "8085:8085"
      - "1455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/CLIProxyAPI/auths
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      # Persist store-installed plugins across container recreate (default plugins.dir).
      # Prefer the fork variable while remaining compatible with upstream deployments.
      - ${CLI_PROXY_PLUGINS_PATH:-${CLI_PROXY_PLUGIN_PATH:-./plugins}}:/CLIProxyAPI/plugins
      # Persist plugin runtime databases and other plugin-owned state.
      - ${CLI_PROXY_DATA_PATH:-./data}:/CLIProxyAPI/data
      - ./log-uploader.yaml:/CLIProxyAPI/log-uploader.yaml
      # Read-only QA reports for Management "LOG QA" panel
      - ./log-qa.yaml:/CLIProxyAPI/log-qa.yaml:ro
    restart: unless-stopped

  log-uploader:
    image: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:latest}
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: cli-proxy-api-uploader
    command: ["./log-uploader", "-config", "/CLIProxyAPI/log-uploader.yaml"]
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/CLIProxyAPI/auths
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ./log-uploader.yaml:/CLIProxyAPI/log-uploader.yaml
    env_file:
      - .env
    environment:
      TOS_ACCESS_KEY_ID: ${TOS_ACCESS_KEY_ID}
      TOS_SECRET_ACCESS_KEY: ${TOS_SECRET_ACCESS_KEY}
    depends_on:
      - cli-proxy-api
    restart: unless-stopped

  # Read-only quality checker for unuploaded local request logs.
  # Does not take uploader locks and never deletes source logs.
  # Disabled by default; start on demand with: docker compose --profile qa up -d
  log-qa:
    profiles: ["qa"]
    image: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:latest}
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: cli-proxy-api-log-qa
    command: ["./log-qa", "-config", "/CLIProxyAPI/log-qa.yaml"]
    volumes:
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ./log-qa.yaml:/CLIProxyAPI/log-qa.yaml:ro
    env_file:
      - .env
    depends_on:
      - cli-proxy-api
    restart: unless-stopped
