[supervisord]
nodaemon=true
logfile=/data/logs/supervisor/supervisord.log
pidfile=/run/supervisord.pid
childlogdir=/data/logs/supervisor

[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:cliproxyapi]
command=/bin/bash -lc 'if [ -x /app/current/bin/start.sh ]; then exec /app/current/bin/start.sh foreground; else echo "waiting for /app/current release package"; while true; do sleep 3600; done; fi'
directory=/app/current
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[unix_http_server]
file=/run/supervisor.sock
chmod=0777

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
