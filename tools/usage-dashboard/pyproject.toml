[project]
name = "usage-dashboard"
version = "0.1.0"
description = "CLIProxyAPI usage statistics sidecar"
requires-python = ">=3.10"
dependencies = [
    "sqlmodel>=0.0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyyaml>=6.0",
]

[project.scripts]
usage-dashboard = "usage_dashboard.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["usage_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests", "."]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["usage_dashboard/", "test_usage_dashboard.py", "tests/test_ci_workflow.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]