<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Hub allowances</title>
<style>
:root {
  --ground: oklch(0.985 0.004 85); --ink: oklch(0.27 0.012 260); --strong: oklch(0.17 0.012 260); --muted: oklch(0.49 0.012 260);
  --rule: oklch(0.91 0.006 260); --hover: oklch(0.955 0.006 260); --track: oklch(0.9 0.008 260);
  --accent: oklch(0.5 0.16 255); --ok: oklch(0.64 0.15 155); --warn: oklch(0.76 0.15 70); --bad: oklch(0.6 0.2 25);
  --warn-ink: oklch(0.52 0.13 60); --bad-ink: oklch(0.52 0.19 25);
  color-scheme: light;
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: oklch(0.18 0.012 260); --ink: oklch(0.9 0.008 260); --strong: oklch(0.98 0.004 260); --muted: oklch(0.68 0.012 260);
    --rule: oklch(0.27 0.012 260); --hover: oklch(0.22 0.012 260); --track: oklch(0.36 0.012 260);
    --accent: oklch(0.74 0.12 250); --ok: oklch(0.72 0.15 155); --warn: oklch(0.8 0.14 75); --bad: oklch(0.68 0.18 25);
    --warn-ink: var(--warn); --bad-ink: var(--bad);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font-variant-numeric: tabular-nums; caret-color: var(--accent); scrollbar-color: var(--muted) var(--ground); }
::selection { background: var(--accent); color: var(--ground); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
main { max-width: 1080px; margin: 0 auto; padding: 10px 16px 40px; }
h1 { font-size: 1.125rem; color: var(--strong); margin: 0; letter-spacing: -0.01em; }
.muted { color: var(--muted); }
.spacer { flex: 1; }
button, select, input { font: inherit; color: inherit; }
button { border: 1px solid var(--rule); background: transparent; border-radius: 6px; padding: 6px 12px; min-height: 36px; cursor: pointer; }
button:active { background: var(--track); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--ground); font-weight: 600; }
button:disabled { opacity: .55; cursor: progress; }
select, input { border: 1px solid var(--rule); background: var(--ground); border-radius: 6px; padding: 6px 8px; min-height: 36px; min-width: 0; }
@media (hover: hover) and (pointer: fine) {
  button:not(.primary):hover, details.acct > summary:hover, .chip:hover { background: var(--hover); }
}
header { display: flex; align-items: center; gap: 10px; padding-bottom: 8px; white-space: nowrap; }
header button { padding: 4px 12px; font-size: .85rem; }

/* Spend next: the router's next account per provider. */
#chips { display: flex; align-items: center; gap: 6px; padding-bottom: 12px; border-bottom: 1px solid var(--rule); overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain; }
#chips > span { flex: none; font-size: .8rem; color: var(--muted); margin-right: 2px; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 4px 10px 4px 8px; border: 1px solid var(--rule); border-radius: 999px; color: var(--ink); text-decoration: none; font-size: .85rem; white-space: nowrap; }
.chip:active { background: var(--track); }
.chip b { color: var(--strong); font-weight: 650; }
.chip .logo { width: 16px; height: 16px; }

.logo { width: 24px; height: 24px; flex: none; color: var(--strong); }
.logo.initial { display: inline-grid; place-items: center; border-radius: 6px; background: var(--track); font: 700 .75rem/1 system-ui, sans-serif; }

/* One row per plan. Phone: name over bars, figure over reset. Wide: one line. */
.row { display: grid; grid-template-columns: 24px minmax(0, 1fr) 5.5rem; grid-template-areas: "logo name fig" "logo bars when"; column-gap: 12px; row-gap: 5px; align-items: center; padding: 11px 6px; border-bottom: 1px solid var(--rule); }
.row > .logo { grid-area: logo; align-self: start; margin-top: 2px; }
.name { grid-area: name; min-width: 0; display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--strong); white-space: nowrap; }
.name { flex-wrap: wrap; row-gap: 4px; }
.name .n { min-width: 0; max-width: 100%; overflow: clip; text-overflow: ellipsis; }
.bars { grid-area: bars; min-width: 0; display: grid; gap: 4px; }
.fig { grid-area: fig; justify-self: end; font-size: 1.125rem; font-weight: 650; line-height: 1.1; color: var(--strong); }
.when { grid-area: when; justify-self: end; align-self: start; font-size: .8rem; color: var(--ink); white-space: nowrap; }
.when .lbl { display: none; color: var(--muted); }
.stale > summary > :is(.bars, .fig) { opacity: .45; }
.out-early { color: var(--warn-ink); white-space: nowrap; }
button.danger { border-color: var(--bad-ink); color: var(--bad-ink); }
.actions label { flex: 1 1 140px; display: grid; gap: 2px; font-size: .75rem; color: var(--muted); }
.actions label input { color: var(--ink); font-size: .95rem; }
.fig.warn, .when.warn, .warn { color: var(--warn-ink); }
.fig.bad, .when.bad, .bad { color: var(--bad-ink); }

/* The gauge: twenty blocks, like sysdash's bar, filled by what is left. */
.gauge { height: 10px; background: var(--track); -webkit-mask: repeating-linear-gradient(90deg, #000 0 calc(5% - 2px), transparent calc(5% - 2px) 5%); mask: repeating-linear-gradient(90deg, #000 0 calc(5% - 2px), transparent calc(5% - 2px) 5%); }
.gauge i, .thin i { display: block; height: 100%; background: var(--ok); }
.gauge i.warn, .thin i.warn { background: var(--warn); }
.gauge i.bad, .thin i.bad { background: var(--bad); }
.sub { display: flex; align-items: center; gap: 8px; font-size: .75rem; color: var(--muted); line-height: 1; }
.thin { flex: 1; height: 3px; background: var(--track); border-radius: 2px; overflow: clip; }
.sub .cap { flex: none; }
.none { font-size: .8rem; color: var(--muted); }

.tag { flex: none; font: 650 .68rem/1 system-ui, sans-serif; letter-spacing: .03em; text-transform: uppercase; padding: 3px 5px; border-radius: 4px; border: 1px solid currentColor; }
.tag.next { color: var(--ground); background: var(--accent); border-color: var(--accent); }
.tag.bank { color: var(--accent); text-transform: none; letter-spacing: 0; }
.tag.bank.warn { color: var(--warn-ink); }
.tag.off { color: var(--muted); }

details.acct > summary { list-style: none; cursor: pointer; }
details.acct > summary::-webkit-details-marker { display: none; }
details.acct > summary:active { background: var(--hover); }
details.acct:target > summary { background: var(--hover); }
details.acct[open] > summary { border-bottom-color: transparent; }
details.acct.out > summary > :is(.logo, .bars, .fig) { opacity: .45; }
details.acct.out .name { color: var(--muted); }

.body { padding: 0 6px 14px 42px; border-bottom: 1px solid var(--rule); }
.win { padding: 6px 0; }
.win .top, .win .bottom { display: flex; justify-content: space-between; gap: 8px; }
.win .top { font-size: .9rem; }
.win .bottom { font-size: .8rem; color: var(--muted); }
.win .thin { display: block; height: 5px; margin: 4px 0 3px; }
dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 14px; margin: 8px 0 0; font-size: .85rem; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }

#login { max-width: 400px; margin: 14vh auto; padding: 0 16px; }
#login form { display: flex; gap: 8px; margin-top: 14px; }
#login input { flex: 1; }
.error { color: var(--bad-ink); margin: 6px 0 0; }
.error:empty { display: none; }
footer { margin-top: 24px; color: var(--muted); font-size: .8rem; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
code { font-size: .95em; }

@media (min-width: 760px) {
  main { padding: 18px 28px 48px; }
  #chips { flex-wrap: wrap; }
  .row { grid-template-columns: 24px minmax(12rem, 17rem) minmax(0, 1fr) 4.5rem 9rem; grid-template-areas: "logo name bars fig when"; column-gap: 18px; padding: 9px 8px; }
  .row > .logo { align-self: center; margin-top: 0; }
  .when { align-self: center; justify-self: start; }
  .when .lbl { display: inline; }
  .body { padding-left: 50px; }
  .body > * { max-width: 46rem; }
}
</style>
</head>

const NAMES = {
  claude: "Claude", codex: "Codex", kimi: "Kimi", xai: "Grok", antigravity: "Antigravity", meta: "Muse", devin: "Devin", gemini: "Gemini",
  commandcode: "CommandCode", "opencode-go": "OpenCode Go", zai: "GLM", deepseek: "DeepSeek", local: "Local",
};
// A window is spent at SPENT percent used (cxswap's line, as the router uses);
// its bar turns amber below WARN percent left and red at LOW or less (sysdash's colours).
const SPENT = 95, WARN = 40, LOW = 15;
const providerKey = (p) => (p || "other").replace(/^openai-compatib(le|ility)-/, "");
const providerName = (p) => NAMES[providerKey(p)] || providerKey(p);
const $ = (id) => document.getElementById(id);
let data = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const time = (s) => (s ? new Date(s) : null);
const future = (d) => d && d > new Date();

function ago(d) {
  const m = Math.round((Date.now() - d) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + "m ago";
  if (m < 48 * 60) return Math.round(m / 60) + "h ago";
  return Math.round(m / 1440) + "d ago";
}
function until(d) {
  let m = Math.max(0, Math.round((d - Date.now()) / 60000));
  const days = Math.floor(m / 1440); m -= days * 1440;
  const h = Math.floor(m / 60); m -= h * 60;
  return days ? `${days}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
}
function clock(d) {
  const hm = d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  if (d.toDateString() === new Date().toDateString()) return hm;
  const day = Math.abs(d - Date.now()) < 6 * 86400000 ? { weekday: "short" } : { day: "numeric", month: "short" };
  return d.toLocaleDateString(undefined, day) + " " + hm;
}
function cadence(minutes, short) {
  if (!minutes) return short ? "" : "Allowance";
  const near = (m, tolerance) => Math.abs(minutes - m) < tolerance;
  if (near(300, 5)) return short ? "5h" : "5-hour";
  if (near(1440, 5)) return short ? "day" : "Daily";
  if (near(10080, 60)) return short ? "week" : "Weekly";
  if (minutes >= 40000 && minutes <= 46000) return short ? "month" : "Monthly";
  return minutes >= 1440 ? Math.round(minutes / 1440) + (short ? "d" : "-day") : Math.round(minutes / 60) + (short ? "h" : "-hour");
}
function money(b) {
  try { return new Intl.NumberFormat(undefined, { style: "currency", currency: b.currency || "USD" }).format(b.left); } catch { return `${b.left} ${b.currency}`; }
}

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { Authorization: "Bearer " + localStorage.getItem(KEY), "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { signOut("That key was refused."); throw new Error("unauthorized"); }
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
  return json;
}

// blocker says why the router will not pick this account now, or null.
function blocker(a) {
  if (a.disabled) return { text: "Disabled", when: "disabled", cls: "off" };
  const hold = time(a.hold_until);
  if (future(hold)) return { text: `Held until ${clock(hold)} (${until(hold)})`, when: `held ${until(hold)}`, tag: "Held", cls: "warn" };
  const retry = time(a.next_retry_after);
  if (a.unavailable || future(retry)) return { text: future(retry) ? `Cooling down until ${clock(retry)}` : (a.status_message || "Unavailable"), when: "cooling", tag: "Cooling", cls: "warn" };
  return null;
}

function plan(a) {
  const p = ((a.usage && a.usage.plan) || (a.id_token && a.id_token.plan_type) || "").replace(/^SUBSCRIPTION_TIER_/, "").replace(/_/g, " ");
  return p === p.toLowerCase() ? p.replace(/\b[a-z]/g, (c) => c.toUpperCase()) : p;
}
function windowsOf(a) {
  return ((a.usage && a.usage.windows) || []).filter((w) => !w.reset_at || future(time(w.reset_at)));
}
const left = (w) => Math.max(0, Math.min(100, 100 - (w.used_percent || 0)));
const tone = (l) => (l <= LOW ? "bad" : l < WARN ? "warn" : "");
const shortName = (w) => [w.label && w.label.replace(/ only$/, ""), cadence(w.window_minutes, true)].filter(Boolean).join(" ") || "allowance";
const longName = (w) => [w.label, cadence(w.window_minutes)].filter(Boolean).join(" · ");
const isWeek = (w) => Math.abs((w.window_minutes || 0) - 10080) < 60;
function weekly(a) { return windowsOf(a).find((w) => !w.label && isWeek(w)); }
function banked(a) {
  return ((a.usage && a.usage.banked_resets) || []).filter((c) => !c.expires_at || future(time(c.expires_at)));
}
function updated(a) {
  const observed = time(a.quota && a.quota.observed_at), fetched = time(a.usage && a.usage.fetched_at);
  return observed && (!fetched || observed > fetched) ? observed : fetched;
}

// rowsOf gives one row per plan. An account whose windows are all named pools
// (Antigravity's Gemini and Claude/GPT) is one row per pool, as allowances shows it.
function rowsOf(a) {
  const wins = windowsOf(a), pools = [...new Set(wins.map((w) => w.label || ""))];
  if (pools.length > 1 && !pools.includes("")) return pools.map((p) => makeRow(a, wins.filter((w) => w.label === p), p));
  const plain = wins.filter((w) => !w.label);
  return [makeRow(a, plain.length ? plain : wins, "")];
}
// The row's bar is its weekly window (the one consume-first ranks on), else its
// longest; the thin bar is the tightest of the rest, usually the 5-hour window.
function makeRow(a, wins, pool) {
  const main = wins.find(isWeek) || wins.reduce((m, w) => (!m || (w.window_minutes || 0) > (m.window_minutes || 0) ? w : m), null);
  const rest = wins.filter((w) => w !== main);
  const second = rest.reduce((m, w) => (!m || left(w) < left(m) ? w : m), null);
  const full = wins.filter((w) => w.used_percent >= SPENT);
  const spent = full.length > 0 || (!pool && !!(a.consume_first && a.consume_first.spent));
  const back = full.reduce((m, w) => { const r = time(w.reset_at); return r && (!m || r > m) ? r : m; }, null);
  const cf = a.consume_first || {};
  return {
    a, pool, main, second, spent, back, wins: pool ? wins : windowsOf(a),
    id: (a.id + (pool ? "-" + pool : "")).replace(/[^\w.-]+/g, "-"), provider: providerKey(a.provider), blocker: a._blocker,
    reset: time((main && main.reset_at) || cf.reset_at), used: main ? main.used_percent || 0 : cf.used_percent || 0,
    balance: a.usage && a.usage.balance,
  };
}
function rowName(r) {
  const a = r.a, pool = r.pool && r.pool.replace(/ models$/i, "").replace(/ and /, "/");
  if (a.note) return [a.note, pool].filter(Boolean).join(" ");
  const p = providerName(a.provider), pl = plan(a);
  return [pl.toLowerCase().startsWith(p.toLowerCase()) ? pl : p, pl.toLowerCase().startsWith(p.toLowerCase()) ? "" : pl, pool].filter(Boolean).join(" ");
}

// order is consume-first across every provider: usable before spent before held,
// then soonest reset, least used, id (docs/estate-hub.md, "Reading the state").
function order(x, y) {
  if (!!x.blocker !== !!y.blocker) return x.blocker ? 1 : -1;
  if ((y.a.priority || 0) !== (x.a.priority || 0)) return (y.a.priority || 0) - (x.a.priority || 0);
  if (x.spent !== y.spent) return x.spent ? 1 : -1;
  if (!!x.reset !== !!y.reset) return x.reset ? -1 : 1;
  if (x.reset && +x.reset !== +y.reset) return x.reset - y.reset;
  if (x.used !== y.used) return x.used - y.used;
  return String(x.id).localeCompare(String(y.id));
}

// pace projects a window to its reset at the rate it has been used so far, the
// way CodexBar does: will it last, and how far ahead of an even spend is it.
function pace(w) {
  const reset = time(w.reset_at), minutes = w.window_minutes || 0;
  if (!reset || !minutes) return null;
  const duration = minutes * 60000, remaining = reset - Date.now(), used = 100 - left(w);
  if (remaining <= 0 || remaining > duration) return null;
  if (used >= 100) return { spent: true, reset };
  if (used <= 0) return { unused: true };
  const elapsed = duration - remaining;
  if (elapsed <= 0) return null;
  const empty = ((100 - used) * elapsed) / used;
  return { spare: (elapsed / duration) * 100 - used, lasts: empty >= remaining, emptyAt: new Date(Date.now() + empty) };
}
// runsOut flags a window under half left that is on course to run dry before
// it resets (earlier in a window the projection is noise).
function runsOut(w) {
  const p = pace(w);
  return !!p && p.lasts === false && left(w) <= 50;
}
function paceText(w) {
  const p = pace(w);
  if (!p || p.unused) return p ? "Not started" : "";
  if (p.spent) return "Spent";
  const spare = Math.round(p.spare), lead = spare >= 5 ? `${spare} spare` : spare <= -5 ? `${-spare} over` : "On pace";
  return p.lasts ? `${lead}, lasts to reset` : `${lead}, runs out in ${until(p.emptyAt)}`;
}

function logoHTML(provider, cls) {
  if (document.getElementById("logo-" + provider)) return `<svg class="logo ${cls || ""}" aria-hidden="true"><use href="#logo-${provider}"/></svg>`;
  return `<span class="logo initial ${cls || ""}" aria-hidden="true">${esc(providerName(provider).slice(0, 1).toUpperCase())}</span>`;
}
function meter(w, cls, label) {
  const l = Math.round(left(w));
  return `<span class="${cls}" role="meter" aria-label="${esc(label)}" aria-valuenow="${l}" aria-valuemin="0" aria-valuemax="100"><i class="${tone(l)}" style="width:${l}%"></i></span>`;
}
function balanceText(b) {
  return b.total ? `${money(b)} of ${money({ left: b.total, currency: b.currency })} left` : `${money(b)} balance`;
}
function bankTag(a) {
  const credits = banked(a);
  if (!credits.length) return "";
  const first = credits[0].expires_at ? time(credits[0].expires_at) : null;
  const soon = first && first - Date.now() < 3 * 86400000;
  return `<span class="tag bank${soon ? " warn" : ""}" title="${first ? `First expires ${esc(clock(first))}. ` : ""}Redeem in Codex.">${credits.length} banked${soon ? ` · next ends ${until(first).split(" ")[0]}` : ""}</span>`;
}

function windowHTML(w) {
  const reset = time(w.reset_at), l = Math.round(left(w));
  return `<div class="win"><div class="top"><span>${esc(longName(w))}</span><span class="${tone(l)}">${l}% left</span></div>` +
    meter(w, "thin", longName(w) + " left") +
    `<div class="bottom"><span>${reset ? `Resets ${clock(reset)} (${until(reset)})` : ""}</span><span>${esc(paceText(w))}</span></div></div>`;
}

function factsHTML(r) {
  const a = r.a, facts = [], b = r.blocker, up = updated(a), err = a.usage && a.usage.error;
  if (b) facts.push(["State", `<span class="${b.cls === "off" ? "" : b.cls}">${esc(b.text)}</span>`]);
  if (plan(a)) facts.push(["Plan", esc(plan(a))]);
  if (a.email && a.email !== rowName(r)) facts.push(["Login", esc(a.email)]);
  if (a.source === "config") facts.push(["Source", "API key in the config file"]);
  if (r.balance) facts.push(["Balance", esc(balanceText(r.balance))]);
  const credits = banked(a);
  if (credits.length) {
    facts.push(["Banked", `${credits.length} reset${credits.length === 1 ? "" : "s"}, expiring ` +
      esc(credits.map((c) => (c.expires_at ? clock(time(c.expires_at)) : "never")).join(", ")) + "; redeem in Codex"]);
  }
  if (a.group) facts.push(["Groups", esc(a.group.split(",").map((g) => g.trim()).filter(Boolean).join(", "))]);
  const cooldowns = (a.cooldowns || []).filter((c) => c.scope !== "credential");
  if (cooldowns.length) facts.push(["Cooling", `<span class="warn">${esc(cooldowns.map((c) => c.model_key).join(", "))}</span>`]);
  let ok = 0, failed = 0, last = "";
  for (const bucket of a.recent_requests || []) {
    ok += bucket.success; failed += bucket.failed;
    if (bucket.success + bucket.failed) last = bucket.time;
  }
  if (ok || failed) facts.push(["Requests", esc([ok ? ok + " served" : "", failed ? failed + " failed" : ""].filter(Boolean).join(", ") + ` · last ${last}`)]);
  if (up || err) facts.push(["Figures", `${up ? esc(ago(up)) : ""}${err ? `${up ? " · " : ""}<span class="bad">last poll failed: ${esc(err)}</span>` : ""}`]);
  return facts.length ? `<dl>${facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>` : "";
}

function manageHTML(a) {
  if (a.source === "config") return "";
  const held = future(time(a.hold_until));
  const resetAt = weekly(a) && weekly(a).reset_at;
  return `<div class="actions" data-name="${esc(a.name)}">
    <select aria-label="Hold for"><option value="1">1 hour</option><option value="5" selected>5 hours</option><option value="24">1 day</option>${resetAt ? `<option value="reset:${esc(resetAt)}">Until weekly reset</option>` : ""}</select>
    <button data-act="hold">Hold</button>${held ? '<button data-act="unhold">Release hold</button>' : ""}
    <span class="spacer"></span><button data-act="${a.disabled ? "enable" : "disable"}"${a.disabled ? "" : ' class="danger"'}>${a.disabled ? "Enable" : "Disable"}</button></div>
    <div class="actions" data-name="${esc(a.name)}"><label>Name<input name="note" value="${esc(a.note || "")}"></label><label>Groups, comma separated<input name="group" value="${esc(a.group || "")}"></label><button data-act="save">Save</button></div>`;
}

// figure is the row's number: allowance left, or the balance for a prepaid key.
function figure(r) {
  if (r.balance) return `<span class="fig" title="${esc(balanceText(r.balance))}">${esc(money(r.balance))}</span>`;
  if (!r.main) return '<span class="fig muted">–</span>';
  const l = Math.round(left(r.main));
  return `<span class="fig ${r.spent ? "bad" : tone(l)}">${l}%</span>`;
}
function whenHTML(r) {
  if (r.blocker) return `<span class="when ${r.blocker.cls === "off" ? "" : r.blocker.cls}">${esc(r.blocker.when)}</span>`;
  if (r.spent && r.back) return `<span class="when bad" title="Back ${esc(clock(r.back))}">back ${until(r.back)}</span>`;
  return r.reset ? `<span class="when" title="Resets ${esc(clock(r.reset))}"><span class="lbl">resets </span>${until(r.reset)}</span>` : '<span class="when"></span>';
}
function barsHTML(r) {
  const parts = [], cap = (w) => (r.pool ? cadence(w.window_minutes, true) : shortName(w));
  if (r.main) parts.push(meter(r.main, "gauge", `${shortName(r.main)} left`));
  if (r.second) parts.push(`<span class="sub">${meter(r.second, "thin", `${shortName(r.second)} left`)}<span class="cap">${esc(cap(r.second))} ${Math.round(left(r.second))}% left</span></span>`);
  else if (r.main && !isWeek(r.main)) parts.push(`<span class="sub"><span class="cap">${esc(cap(r.main))}</span></span>`);
  const early = [r.main, r.second].filter((w) => w && runsOut(w)).map((w) => `${cap(w)} out ${clock(pace(w).emptyAt)}`);
  if (early.length && !r.spent) parts.push(`<span class="sub"><span class="out-early" title="On course to run out before it resets">${esc(early.join(" · "))}</span></span>`);
  if (!parts.length) parts.push(`<span class="none">${r.balance ? "Prepaid balance" : r.a.source === "config" ? "No figures for this API" : "No figures yet"}</span>`);
  return `<span class="bars">${parts.join("")}</span>`;
}

function rowHTML(r, isNext) {
  const a = r.a, b = r.blocker, err = a.usage && a.usage.error;
  const tags = [isNext ? '<span class="tag next">Next</span>' : "",
    b && b.tag ? `<span class="tag ${b.cls}">${b.tag}</span>` : "",
    !b && r.spent ? '<span class="tag bad">Spent</span>' : "",
    err ? '<span class="tag bad" title="The last usage poll failed">Poll failed</span>' : "",
    bankTag(a)].join("");
  return `<details class="acct${b ? " out" : err ? " stale" : ""}" id="r-${esc(r.id)}" data-id="${esc(r.id)}"><summary class="row">` +
    `${logoHTML(r.provider)}<span class="name"><span class="n">${esc(rowName(r))}</span>${tags}</span>${barsHTML(r)}${figure(r)}${whenHTML(r)}</summary>` +
    `<div class="body">${r.wins.map(windowHTML).join("")}${factsHTML(r)}${manageHTML(a)}</div></details>`;
}

function chipHTML(r, many) {
  const who = many ? rowName(r).replace(new RegExp("^" + providerName(r.provider) + " ", "i"), "") : "";
  const fig = r.balance ? money(r.balance) : Math.round(left(r.main)) + "%";
  return `<a class="chip" href="#r-${esc(r.id)}" title="Spend next on ${esc(providerName(r.provider))}: ${esc(rowName(r))}">${logoHTML(r.provider)}${who ? `<span>${esc(who)}</span>` : ""}<b>${esc(fig)}</b>${r.reset ? `<span class="muted">${until(r.reset)}</span>` : ""}</a>`;
}

function render() {
  const consumeFirst = /^(consume-?first|cf)$/i.test(data.strategy || "");
  const refresh = data.usage_refresh && data.usage_refresh.interval;
  $("updated").textContent = "Updated " + clock(new Date());
  $("meta").textContent = `Routing ${data.strategy || "round-robin"} · usage polled ${refresh ? "every " + refresh : "only from traffic"}`;
  const rows = [];
  for (const a of data.accounts) {
    a._blocker = blocker(a);
    rows.push(...rowsOf(a));
  }
  rows.sort(order);
  // The router's next account per provider: its first usable, unspent row.
  const next = new Map();
  if (consumeFirst) for (const r of rows) if (!r.blocker && !r.spent && !next.has(r.provider)) next.set(r.provider, r);
  const chips = [...next.values()].filter((r) => r.main || r.balance);
  const several = new Set(rows.map((r) => r.provider).filter((p, i, all) => all.indexOf(p) !== i));
  $("chips").innerHTML = chips.length ? "<span>Spend next</span>" + chips.map((r) => chipHTML(r, several.has(r.provider))).join("") : "";
  $("chips").hidden = !chips.length;
  const open = new Set([...document.querySelectorAll("details.acct[open]")].map((d) => d.dataset.id));
  const accounts = (p) => new Set(rows.filter((r) => r.provider === p).map((r) => r.a.id)).size;
  const many = new Set([...next.keys()].filter((p) => accounts(p) > 1));
  $("accounts").innerHTML = rows.map((r) => rowHTML(r, many.has(r.provider) && next.get(r.provider) === r)).join("") || '<p class="muted">The hub holds no credentials.</p>';
  for (const d of document.querySelectorAll("details.acct")) if (open.has(d.dataset.id)) d.open = true;
}

async function load() {
  $("reload").disabled = true;
  try {
    data = await api("GET", "/v8/management/credentials/usage");
    $("error").textContent = "";
    render();
  } catch (e) {
    if (e.message !== "unauthorized") $("error").textContent = "Could not load the hub state: " + e.message;
  } finally {
    $("reload").disabled = false;
  }
}

async function act(button) {
  const box = button.closest(".actions"), name = box.dataset.name, act = button.dataset.act;
  button.disabled = true;
  try {
    if (act === "hold") {
      const choice = box.querySelector("select").value;
      const until = choice.startsWith("reset:") ? new Date(choice.slice(6)) : new Date(Date.now() + Number(choice) * 3600000);
      await api("PATCH", "/v8/management/credentials/fields", { name, hold_until: until.toISOString().replace(/\.\d+Z$/, "Z") });
    } else if (act === "unhold") {
      await api("PATCH", "/v8/management/credentials/fields", { name, hold_until: null });
    } else if (act === "disable" || act === "enable") {
      await api("PATCH", "/v8/management/credentials/status", { name, disabled: act === "disable" });
    } else if (act === "save") {
      const note = box.querySelector("[name=note]").value.trim();
      const group = box.querySelector("[name=group]").value.split(",").map((g) => g.trim()).filter(Boolean).join(",");
      await api("PATCH", "/v8/management/credentials/fields", { name, note: note || null, group: group || null });
    }
    await load();
  } catch (e) {
    if (e.message !== "unauthorized") $("error").textContent = `Could not ${act} ${name}: ${e.message}`;
    button.disabled = false;
  }
}

function signOut(message) {
  localStorage.removeItem(KEY);
  $("app").hidden = true;
  $("login").hidden = false;
  $("login-error").textContent = message || "";
  $("key").focus();
}
function start() {
  $("login").hidden = true;
  $("app").hidden = false;
  load();
}

$("login-form").addEventListener("submit", (e) => {
  e.preventDefault();
  localStorage.setItem(KEY, $("key").value.trim());
  $("key").value = "";
  start();
});
$("reload").addEventListener("click", load);
$("logout").addEventListener("click", () => signOut());
$("accounts").addEventListener("click", (e) => {
  const button = e.target.closest("button[data-act]");
  if (button) act(button);
});
// A spend-next chip opens the row it points at.
$("chips").addEventListener("click", (e) => {
  const chip = e.target.closest("a.chip"), row = chip && document.getElementById(chip.hash.slice(1));
  if (row) row.open = true;
});
// Refresh every 30 s while visible, but never under a half-typed name or an open select.
setInterval(() => { if (!document.hidden && data && !document.activeElement.closest(".actions")) load(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && data) load(); });
if (localStorage.getItem(KEY)) start(); else signOut();
</script>
</body>
</html>
