<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Hub allowances</title>
<style>
:root {
  --ground: #fff1e5; --ink: #33302e; --strong: #1a1817; --muted: #66605c; --rule: #e8d6c7; --hover: #fbe6d4;
  --accent: #0f5499; --good: #0d7680; --bad: #990f3d; --warn: #96490a; --track: #f2dfce; --fill: #0f5499;
  --serif: Georgia, "Times New Roman", serif;
  color-scheme: light;
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #1f2229; --ink: #ece1d7; --strong: #fff8f1; --muted: #aea398; --rule: #393d47; --hover: #2a2e37;
    --accent: #8fb9f5; --good: #4fc0b6; --bad: #ff8fac; --warn: #f0a75e; --track: #343843; --fill: #8fb9f5;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font-variant-numeric: tabular-nums; caret-color: var(--accent); scrollbar-color: var(--muted) var(--ground); }
::selection { background: var(--accent); color: var(--ground); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
main { max-width: 1240px; margin: 0 auto; padding: 12px 16px 40px; }
header { display: flex; align-items: center; gap: 12px; padding-bottom: 10px; }
h1, h2, h3 { font-family: var(--serif); color: var(--strong); margin: 0; }
h1 { font-size: 1.5rem; letter-spacing: -0.01em; }
h2 { font-size: 1.125rem; border-top: 2px solid var(--strong); padding-top: 6px; margin: 22px 0 2px; display: flex; align-items: baseline; gap: 8px; }
h3 { font-size: 1rem; padding: 14px 0 4px; display: flex; align-items: baseline; gap: 8px; border-bottom: 1px solid var(--strong); }
h2 small, h3 small { font: 400 .8rem/1 system-ui, sans-serif; color: var(--muted); margin-left: auto; }
.muted { color: var(--muted); }
.spacer { flex: 1; }
button, select, input { font: inherit; color: inherit; }
button { border: 1px solid var(--muted); background: transparent; border-radius: 6px; padding: 6px 12px; min-height: 36px; cursor: pointer; }
button:hover { background: var(--hover); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--ground); font-weight: 600; }
button:disabled { opacity: .55; cursor: progress; }
select, input { border: 1px solid var(--muted); background: var(--ground); border-radius: 6px; padding: 6px 8px; min-height: 36px; min-width: 0; }
.list { list-style: none; margin: 0; padding: 0; }
/* A ticker row: what and whose on the left, the figure and its pace on the right. */
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--rule); }
.row > :nth-child(even) { text-align: right; }
.what { font-weight: 600; color: var(--strong); min-width: 0; display: flex; align-items: baseline; white-space: nowrap; }
.what .name { overflow: hidden; text-overflow: ellipsis; }
.what .who { font-weight: 400; color: var(--ink); margin-left: .3em; }
.fig { font-size: 1.25rem; font-weight: 600; line-height: 1.15; color: var(--strong); }
.fig small { font-size: .75rem; font-weight: 400; color: var(--muted); margin-left: 2px; }
.line { font-size: .85rem; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pace { font-size: .85rem; white-space: nowrap; }
.good { color: var(--good); }
.bad { color: var(--bad) !important; }
.warn { color: var(--warn); }
.mark { flex: none; font: 600 .7rem/1 system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase; padding: 2px 5px; border-radius: 3px; border: 1px solid currentColor; margin-left: 6px; vertical-align: 2px; }
.mark.next { color: var(--ground); background: var(--accent); border-color: var(--accent); }
.mark.bad, .mark.warn, .mark.off { background: transparent; }
.mark.off { color: var(--muted); }
details.acct > summary { list-style: none; cursor: pointer; }
details.acct > summary::-webkit-details-marker { display: none; }
details.acct > summary:hover { background: var(--hover); }
details.acct[open] > summary { border-bottom-color: transparent; }
details.acct.out .what, details.acct.out .fig, details.acct.out .pace { color: var(--muted) !important; }
.body { padding: 2px 0 14px; border-bottom: 1px solid var(--rule); }
.win { padding: 6px 0; }
.win .top { display: flex; justify-content: space-between; gap: 8px; font-size: .9rem; }
.bar { height: 4px; background: var(--track); margin: 4px 0 3px; }
.bar i { display: block; height: 100%; background: var(--fill); }
.bar i.bad { background: var(--bad); }
.win .bottom { display: flex; justify-content: space-between; gap: 8px; font-size: .8rem; color: var(--muted); }
dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 14px; margin: 8px 0 0; font-size: .85rem; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
.actions input { flex: 1 1 140px; }
.chev { flex: none; width: 10px; height: 10px; margin-left: 6px; vertical-align: 1px; color: var(--muted); transition: transform .12s ease-out; }
details[open] .chev { transform: rotate(90deg); }
#login { max-width: 400px; margin: 14vh auto; padding: 0 16px; }
#login form { display: flex; gap: 8px; margin-top: 14px; }
#login input { flex: 1; }
.error { color: var(--bad); margin: 6px 0 0; }
.error:empty { display: none; }
footer { margin-top: 28px; padding-top: 8px; border-top: 1px solid var(--rule); color: var(--muted); font-size: .8rem; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
code { font-size: .95em; }
@media (min-width: 960px) {
  main { padding: 20px 28px 48px; }
  .cols { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; align-items: start; }
}
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
</style>
</head>
<body>
<div id="login" hidden>
  <h1>Hub allowances</h1>
  <p class="muted">Enter the management key. It stays in this browser.</p>
  <form id="login-form">
    <input id="key" type="password" autocomplete="current-password" aria-label="Management key" required>
    <button class="primary">Open</button>
  </form>
  <p id="login-error" class="error" role="alert"></p>
</div>
<main id="app" hidden>
  <header>
    <h1>Hub</h1>
    <span class="spacer"></span>
    <span id="updated" class="muted"></span>
    <button id="reload">Refresh</button>
  </header>
  <p id="error" class="error" role="alert"></p>
  <div id="content" class="cols" hidden>
    <div>
      <section id="next-section"><h2>Spend next</h2><ul id="next" class="list"></ul></section>
      <section id="low-section"><h2>Running low <small id="low-count"></small></h2><ul id="low" class="list"></ul></section>
      <section id="banked-section"><h2>Banked resets</h2><ul id="banked" class="list"></ul></section>
    </div>
    <section><h2>Accounts</h2><div id="accounts"></div></section>
  </div>
  <footer>
    <span id="meta"></span>
    <span>Pin a client with the header <code>X-CPA-Account: &lt;account or group&gt;</code>.</span>
    <span class="spacer"></span>
    <button id="logout">Sign out</button>
  </footer>
</main>
<script>
"use strict";
const KEY = "cpa-hub-management-key";
const NAMES = {
  claude: "Claude", codex: "Codex", kimi: "Kimi", xai: "Grok", antigravity: "Antigravity", meta: "Muse", devin: "Devin", gemini: "Gemini",
  commandcode: "CommandCode", "opencode-go": "OpenCode Go", zai: "GLM", deepseek: "DeepSeek", local: "Local",
};
const ORDER = Object.keys(NAMES);
// An allowance is running low at LOW percent left, or below half left when it
// is on course to run out before it resets (earlier projections are noise).
const LOW = 15;
const providerKey = (p) => (p || "other").replace(/^openai-compatib(le|ility)-/, "");
const providerName = (p) => NAMES[providerKey(p)] || providerKey(p);
const $ = (id) => document.getElementById(id);
const CHEV = '<svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1.5 6.5 5 3 8.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
let data = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const time = (s) => (s ? new Date(s) : null);
const future = (d) => d && d > new Date();

function ago(d) {
  const m = Math.round((Date.now() - d) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + "m ago";
  if (m < 48 * 60) return Math.round(m / 60) + "h ago";
  return Math.round(m / 1440) + "d ago";
}
function until(d) {
  let m = Math.max(0, Math.round((d - Date.now()) / 60000));
  const days = Math.floor(m / 1440); m -= days * 1440;
  const h = Math.floor(m / 60); m -= h * 60;
  return days ? `${days}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
}
function clock(d) {
  const hm = d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  if (d.toDateString() === new Date().toDateString()) return hm;
  const day = Math.abs(d - Date.now()) < 6 * 86400000 ? { weekday: "short" } : { day: "numeric", month: "short" };
  return d.toLocaleDateString(undefined, day) + " " + hm;
}
function cadence(minutes, short) {
  if (!minutes) return short ? "" : "Allowance";
  const near = (m, tolerance) => Math.abs(minutes - m) < tolerance;
  if (near(300, 5)) return short ? "5h" : "5-hour";
  if (near(1440, 5)) return short ? "day" : "Daily";
  if (near(10080, 60)) return short ? "week" : "Weekly";
  if (minutes >= 40000 && minutes <= 46000) return short ? "month" : "Monthly";
  const n = minutes >= 1440 ? Math.round(minutes / 1440) + (short ? "d" : "-day") : Math.round(minutes / 60) + (short ? "h" : "-hour");
  return n;
}
function money(b) {
  try { return new Intl.NumberFormat(undefined, { style: "currency", currency: b.currency || "USD" }).format(b.left); } catch { return `${b.left} ${b.currency}`; }
}

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { Authorization: "Bearer " + localStorage.getItem(KEY), "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) { signOut("That key was refused."); throw new Error("unauthorized"); }
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
  return json;
}

// blocker says why the router will not pick this account now, or null.
function blocker(a) {
  if (a.disabled) return { text: "Disabled", mark: "Disabled", cls: "off" };
  const hold = time(a.hold_until);
  if (future(hold)) return { text: `Held until ${clock(hold)} (${until(hold)})`, mark: "Held", cls: "warn" };
  const retry = time(a.next_retry_after);
  if (a.unavailable || future(retry)) return { text: future(retry) ? `Cooling down until ${clock(retry)}` : (a.status_message || "Unavailable"), mark: "Cooling down", cls: "warn" };
  return null;
}

// routerOrder reproduces consume-first within a provider (docs/estate-hub.md).
function routerOrder(a, b) {
  const ab = !!a._blocker, bb = !!b._blocker;
  if (ab !== bb) return ab ? 1 : -1;
  if ((b.priority || 0) !== (a.priority || 0)) return (b.priority || 0) - (a.priority || 0);
  const ca = a.consume_first || {}, cb = b.consume_first || {};
  if (!!ca.spent !== !!cb.spent) return ca.spent ? 1 : -1;
  if (!!ca.reset_at !== !!cb.reset_at) return ca.reset_at ? -1 : 1;
  if (ca.reset_at && ca.reset_at !== cb.reset_at) return new Date(ca.reset_at) - new Date(cb.reset_at);
  if ((ca.used_percent || 0) !== (cb.used_percent || 0)) return (ca.used_percent || 0) - (cb.used_percent || 0);
  return String(a.id).localeCompare(String(b.id));
}

function displayName(a) { return a.note || (a.source === "config" ? "API key" : a.label || a.email || a.name || a.id); }
function plan(a) {
  const p = (a.usage && a.usage.plan) || (a.id_token && a.id_token.plan_type) || "";
  return p.replace(/^SUBSCRIPTION_TIER_/, "").replace(/_/g, " ");
}
function windowsOf(a) {
  return ((a.usage && a.usage.windows) || []).filter((w) => !w.reset_at || future(time(w.reset_at)));
}
const left = (w) => Math.max(0, Math.min(100, 100 - (w.used_percent || 0)));
// binding is the main window with the least left: the one that stops the account first.
function binding(a) {
  const all = windowsOf(a), main = all.filter((w) => !w.label);
  return (main.length ? main : all).reduce((m, w) => (!m || left(w) < left(m) ? w : m), null);
}
const shortName = (w) => [w.label && w.label.replace(/ only$/, ""), cadence(w.window_minutes, true)].filter(Boolean).join(" ") || "allowance";
const longName = (w) => [w.label, cadence(w.window_minutes)].filter(Boolean).join(" · ");
function weekly(a) {
  return windowsOf(a).find((w) => !w.label && Math.abs((w.window_minutes || 0) - 10080) < 60);
}
function banked(a) {
  return ((a.usage && a.usage.banked_resets) || []).filter((c) => !c.expires_at || future(time(c.expires_at)));
}
function updated(a) {
  const observed = time(a.quota && a.quota.observed_at), fetched = time(a.usage && a.usage.fetched_at);
  return observed && (!fetched || observed > fetched) ? observed : fetched;
}

// pace projects a window to its reset at the rate it has been used so far, the
// way CodexBar does: will it last, and how far ahead of an even spend is it.
function pace(w) {
  const reset = time(w.reset_at), minutes = w.window_minutes || 0;
  if (!reset || !minutes) return null;
  const duration = minutes * 60000, remaining = reset - Date.now(), used = 100 - left(w);
  if (remaining <= 0 || remaining > duration) return null;
  if (used >= 100) return { spent: true, reset };
  if (used <= 0) return { unused: true };
  const elapsed = duration - remaining;
  if (elapsed <= 0) return null;
  const empty = ((100 - used) * elapsed) / used;
  return { spare: (elapsed / duration) * 100 - used, lasts: empty >= remaining, emptyAt: new Date(Date.now() + empty) };
}
function paceMark(w) {
  const p = pace(w);
  if (!p) return null;
  if (p.spent) return { text: `back ${clock(p.reset)}`, cls: "bad" };
  if (p.unused) return { text: "unused", cls: "muted" };
  if (!p.lasts) return { text: `runs out ${clock(p.emptyAt)}`, cls: "bad" };
  return Math.round(p.spare) >= 5 ? { text: `+${Math.round(p.spare)} spare`, cls: "good" } : { text: "on pace", cls: "muted" };
}
function paceText(w) {
  const p = pace(w);
  if (!p || p.unused) return p ? "Not started" : "";
  if (p.spent) return "Spent";
  const spare = Math.round(p.spare), lead = spare >= 5 ? `${spare} spare` : spare <= -5 ? `${-spare} over` : "On pace";
  return p.lasts ? `${lead}, lasts to reset` : `${lead}, runs out in ${until(p.emptyAt)}`;
}
const lowWindow = (w) => {
  const p = pace(w);
  return left(w) <= LOW || (left(w) <= 50 && p && p.lasts === false);
};

function figHTML(w, balance) {
  if (w) return `<span class="fig${left(w) <= LOW ? " bad" : ""}">${Math.round(left(w))}%</span>`;
  if (balance) return `<span class="fig">${esc(money(balance))}</span>`;
  return '<span class="fig muted">–</span>';
}
function markHTML(w) {
  const m = w && paceMark(w);
  return `<span class="pace ${m ? m.cls : ""}">${m ? esc(m.text) : ""}</span>`;
}
function balanceText(b) {
  return b.total ? `${money(b)} of ${money({ left: b.total, currency: b.currency })} left` : `${money(b)} balance`;
}

// tickerRow is the shape every summary row shares; title is trusted HTML.
function tickerRow(title, w, sub, balance) {
  return `<li class="row"><span class="what">${title}</span>${figHTML(w, balance)}<span class="line">${esc(sub)}</span>${markHTML(w)}</li>`;
}

// who names the account beside its provider, unless that only repeats the provider.
function who(a) {
  const name = displayName(a);
  return a.source === "config" || name.toLowerCase() === providerKey(a.provider) ? "" : name;
}

function nextHTML(provider, a) {
  const w = binding(a), b = a.usage && a.usage.balance, reset = w && time(w.reset_at);
  const sub = [who(a), b && w ? balanceText(b) : b ? "balance" : w ? shortName(w) + " left" : "no figures", reset ? "resets " + clock(reset) : ""].filter(Boolean).join(" · ");
  return tickerRow(`<span class="name">${esc(providerName(provider))}</span>`, w, sub, b);
}

// lowRows gives each usable account's lowest window that is running low.
function lowRows(accounts) {
  const rows = [];
  for (const a of accounts) {
    const low = a._blocker ? [] : windowsOf(a).filter(lowWindow).sort((x, y) => left(x) - left(y));
    if (low.length) rows.push({ a, w: low[0] });
  }
  return rows;
}

function windowHTML(w) {
  const reset = time(w.reset_at), l = Math.round(left(w));
  return `<div class="win"><div class="top"><span>${esc(longName(w))}</span><span class="${l <= LOW ? "bad" : ""}">${l}% left</span></div>` +
    `<div class="bar" role="meter" aria-label="${esc(longName(w))} left" aria-valuenow="${l}" aria-valuemin="0" aria-valuemax="100"><i class="${l <= LOW ? "bad" : ""}" style="width:${l}%"></i></div>` +
    `<div class="bottom"><span>${reset ? `Resets ${clock(reset)} (${until(reset)})` : ""}</span><span>${esc(paceText(w))}</span></div></div>`;
}

function factsHTML(a) {
  const facts = [], b = a._blocker, up = updated(a), err = a.usage && a.usage.error;
  if (b) facts.push(["State", `<span class="${b.cls === "off" ? "" : b.cls}">${esc(b.text)}</span>`]);
  if (plan(a)) facts.push(["Plan", esc(plan(a))]);
  if (a.email && a.email !== displayName(a)) facts.push(["Login", esc(a.email)]);
  if (a.source === "config") facts.push(["Source", "API key in the config file"]);
  if (a.usage && a.usage.balance) facts.push(["Balance", esc(balanceText(a.usage.balance))]);
  const credits = banked(a);
  if (credits.length) {
    const first = credits[0].expires_at ? time(credits[0].expires_at) : null;
    facts.push(["Banked", `${credits.length} reset${credits.length === 1 ? "" : "s"}${first ? `, first expires ${esc(clock(first))}` : ""}`]);
  }
  if (a.group) facts.push(["Groups", esc(a.group.split(",").map((g) => g.trim()).filter(Boolean).join(", "))]);
  const cooldowns = (a.cooldowns || []).filter((c) => c.scope !== "credential");
  if (cooldowns.length) facts.push(["Cooling", `<span class="warn">${esc(cooldowns.map((c) => c.model_key).join(", "))}</span>`]);
  let ok = 0, failed = 0, last = "";
  for (const bucket of a.recent_requests || []) {
    ok += bucket.success; failed += bucket.failed;
    if (bucket.success + bucket.failed) last = bucket.time;
  }
  if (ok || failed) facts.push(["Requests", esc([ok ? ok + " served" : "", failed ? failed + " failed" : ""].filter(Boolean).join(", ") + ` · last ${last}`)]);
  if (up || err) facts.push(["Figures", `${up ? esc(ago(up)) : ""}${err ? `${up ? " · " : ""}<span class="bad">last poll failed: ${esc(err)}</span>` : ""}`]);
  return facts.length ? `<dl>${facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>` : "";
}

function manageHTML(a) {
  if (a.source === "config") return "";
  const held = future(time(a.hold_until));
  const resetAt = weekly(a) && weekly(a).reset_at;
  return `<div class="actions" data-name="${esc(a.name)}">
    <select aria-label="Hold for"><option value="1">1 hour</option><option value="5" selected>5 hours</option><option value="24">1 day</option>${resetAt ? `<option value="reset:${esc(resetAt)}">Until weekly reset</option>` : ""}</select>
    <button data-act="hold">Hold</button>${held ? '<button data-act="unhold">Release hold</button>' : ""}
    <button data-act="${a.disabled ? "enable" : "disable"}">${a.disabled ? "Enable" : "Disable"}</button></div>
    <div class="actions" data-name="${esc(a.name)}"><input name="note" aria-label="Name" placeholder="Name" value="${esc(a.note || "")}"><input name="group" aria-label="Groups" placeholder="Groups, comma separated" value="${esc(a.group || "")}"><button data-act="save">Save</button></div>`;
}

function accountHTML(a, isNext) {
  const b = a._blocker, w = binding(a), err = a.usage && a.usage.error;
  const marks = [isNext ? '<span class="mark next">Next</span>' : "",
    b ? `<span class="mark ${b.cls}">${b.mark}</span>` : "",
    !b && a.consume_first && a.consume_first.spent ? '<span class="mark bad">Spent</span>' : "",
    err ? '<span class="mark bad">Poll failed</span>' : ""].join("");
  const others = windowsOf(a).filter((x) => x !== w).map((x) => `${shortName(x)} ${Math.round(left(x))}%`);
  const balance = a.usage && a.usage.balance;
  const sub = [w ? shortName(w) + " left" : "", ...others, balance && w ? balanceText(balance) : "", !w && !balance ? (a.source === "config" ? "No figures for this API" : "No figures yet") : ""].filter(Boolean).join(" · ");
  return `<details class="acct${b ? " out" : ""}" data-id="${esc(a.id)}"><summary class="row">` +
    `<span class="what"><span class="name">${esc(displayName(a))}</span>${marks}${CHEV}</span>${figHTML(w, balance)}<span class="line">${esc(sub)}</span>${markHTML(w)}</summary>` +
    `<div class="body">${windowsOf(a).map(windowHTML).join("")}${factsHTML(a)}${manageHTML(a)}</div></details>`;
}

function render() {
  const consumeFirst = /^(consume-?first|cf)$/i.test(data.strategy || "");
  const refresh = data.usage_refresh && data.usage_refresh.interval;
  $("updated").textContent = "Updated " + clock(new Date());
  $("content").hidden = false;
  $("meta").textContent = `Routing ${data.strategy || "round-robin"} · usage polled ${refresh ? "every " + refresh : "only from traffic"}`;
  const groups = new Map();
  for (const a of data.accounts) {
    a._blocker = blocker(a);
    const key = providerKey(a.provider);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(a);
  }
  const rank = (p) => (ORDER.includes(p) ? ORDER.indexOf(p) : ORDER.length);
  const ordered = [...groups.entries()].sort((x, y) => rank(x[0]) - rank(y[0]) || x[0].localeCompare(y[0]));
  let next = "", accounts = "", bankedRows = "";
  const low = [];
  for (const [provider, list] of ordered) {
    list.sort(routerOrder);
    const first = consumeFirst ? list.find((a) => !a._blocker) : null;
    if (first) next += nextHTML(provider, first);
    const marked = list.length > 1 ? first : null;
    low.push(...lowRows(list));
    for (const a of list) {
      const credits = banked(a);
      if (!credits.length) continue;
      const expiry = credits[0].expires_at ? time(credits[0].expires_at) : null;
      const soon = expiry && expiry - Date.now() < 3 * 86400000;
      bankedRows += `<li class="row"><span class="what"><span class="name">${esc(providerName(provider))}<span class="who">${esc(who(a))}</span></span></span><span class="fig">${credits.length}</span>` +
        `<span class="line${soon ? " warn" : ""}">${expiry ? `first expires ${esc(clock(expiry))} (${until(expiry)})` : "no expiry"}</span><span class="pace muted">redeem in Codex</span></li>`;
    }
    const usable = list.filter((a) => !a._blocker).length;
    accounts += `<h3>${esc(providerName(provider))}<small>${list.length > 1 ? `${usable} of ${list.length} in rotation` : ""}</small></h3>${list.map((a) => accountHTML(a, a === marked)).join("")}`;
  }
  low.sort((x, y) => left(x.w) - left(y.w));
  $("next").innerHTML = next;
  $("next-section").hidden = !next;
  $("low").innerHTML = low.map(({ a, w }) => {
    const reset = time(w.reset_at);
    const title = `<span class="name">${esc(providerName(a.provider))}<span class="who">${esc(who(a))}</span></span>`;
    return tickerRow(title, w, `${shortName(w)} left${reset ? ` · resets ${clock(reset)}` : ""}`);
  }).join("") || '<li class="row"><span class="line">Nothing is running low.</span></li>';
  $("low-count").textContent = low.length || "";
  $("banked").innerHTML = bankedRows;
  $("banked-section").hidden = !bankedRows;
  const open = new Set([...document.querySelectorAll("details.acct[open]")].map((d) => d.dataset.id));
  $("accounts").innerHTML = accounts || '<p class="muted">The hub holds no credentials.</p>';
  for (const d of document.querySelectorAll("details.acct")) if (open.has(d.dataset.id)) d.open = true;
}

async function load() {
  $("reload").disabled = true;
  try {
    data = await api("GET", "/v8/management/credentials/usage");
    $("error").textContent = "";
    render();
  } catch (e) {
    if (e.message !== "unauthorized") $("error").textContent = "Could not load the hub state: " + e.message;
  } finally {
    $("reload").disabled = false;
  }
}

async function act(button) {
  const box = button.closest(".actions"), name = box.dataset.name, act = button.dataset.act;
  button.disabled = true;
  try {
    if (act === "hold") {
      const choice = box.querySelector("select").value;
      const until = choice.startsWith("reset:") ? new Date(choice.slice(6)) : new Date(Date.now() + Number(choice) * 3600000);
      await api("PATCH", "/v8/management/credentials/fields", { name, hold_until: until.toISOString().replace(/\.\d+Z$/, "Z") });
    } else if (act === "unhold") {
      await api("PATCH", "/v8/management/credentials/fields", { name, hold_until: null });
    } else if (act === "disable" || act === "enable") {
      await api("PATCH", "/v8/management/credentials/status", { name, disabled: act === "disable" });
    } else if (act === "save") {
      const note = box.querySelector("[name=note]").value.trim();
      const group = box.querySelector("[name=group]").value.split(",").map((g) => g.trim()).filter(Boolean).join(",");
      await api("PATCH", "/v8/management/credentials/fields", { name, note: note || null, group: group || null });
    }
    await load();
  } catch (e) {
    if (e.message !== "unauthorized") $("error").textContent = `Could not ${act} ${name}: ${e.message}`;
    button.disabled = false;
  }
}

function signOut(message) {
  localStorage.removeItem(KEY);
  $("app").hidden = true;
  $("login").hidden = false;
  $("login-error").textContent = message || "";
  $("key").focus();
}
function start() {
  $("login").hidden = true;
  $("app").hidden = false;
  load();
}

$("login-form").addEventListener("submit", (e) => {
  e.preventDefault();
  localStorage.setItem(KEY, $("key").value.trim());
  $("key").value = "";
  start();
});
$("reload").addEventListener("click", load);
$("logout").addEventListener("click", () => signOut());
$("accounts").addEventListener("click", (e) => {
  const button = e.target.closest("button[data-act]");
  if (button) act(button);
});
// Refresh every 30 s while visible, but never under a half-typed name or an open select.
setInterval(() => { if (!document.hidden && data && !document.activeElement.closest(".actions")) load(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && data) load(); });
if (localStorage.getItem(KEY)) start(); else signOut();
</script>
</body>
