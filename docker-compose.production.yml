services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:?CLI_PROXY_IMAGE must reference a CI-built image}
    container_name: cli-proxy-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8317:8317"
      - "127.0.0.1:8085:8085"
      - "127.0.0.1:1455:1455"
      - "127.0.0.1:54545:54545"
      - "127.0.0.1:51121:51121"
      - "127.0.0.1:56121:56121"
      - "127.0.0.1:11451:11451"
    volumes:
      - ./config.yaml:/CLIProxyAPI/config.yaml
      - ./auths:/root/.cli-proxy-api
      - ./logs:/CLIProxyAPI/logs
      - /root/cert/proxy.austinhmh.com:/certs:ro
    environment:
      DEPLOY: docker
      TZ: Asia/Shanghai
      MANAGEMENT_PASSWORD: ${MANAGEMENT_PASSWORD:-}
    networks:
      cpa-network:
        aliases:
          - cli-proxy-api

networks:
  cpa-network:
    external: true
